[orchestration]
project_name = ""
project_id = ""
host_unprivileged_user = "sandbox" # It is hardcoded but should be set here.

[core]
warmup_prompt = ""
shm_limit = "2gb"
pids_limit = 400
host_uid="1000"
base_image = "cgr.dev/chainguard/wolfi-base:latest"
core_git_user=""
core_git_email=""

[admin]
shm_limit = "2gb"
pids_limit = 400
host_uid="1000"
base_image = "debian:trixie-slim"

[proxy]
shm_limit = "2gb"
pids_limit = 400
host_uid="1000"
base_image = "ubuntu/squid-114-ubuntu24.04"

[dns]
shm_limit = "2gb"
pids_limit = 400
host_uid="1000"
base_image = "coredns/coredns:1.11.1"

[runtimes]
python = true
typescript = true
rust = true
go = false
node_version = "20.12.2"
nvm_version = "0.39.7"

[network.topology]
agent_octet = 3
admin_octet = 2
dns_octet = 53
proxy_octet = 254
postgres_octet = 54

[ingress]
# The orchestrator dynamically maps this to Caddy labels
# e.g., caddy.listen=127.0.X.X:3000
web_ports = [3000, 8080]

[database]
# The orchestrator dynamically injects `- "127.0.X.X:5432:5432"` into compose
expose_host_ports = [5432]

[components]
db_postgres = true
mcp_firecrawl = false
mcp_puppeteer = false

[proxy.whitelist]
# The orchestrator templates these domains natively into Corefile and allowed_domains
domains = [
  ".github.com",
  ".githubusercontent.com",
  ".api.anthropic.com",
  ".npmjs.com",
  ".npmjs.org",
  ".pypi.org",
  ".pythonhosted.org",
  ".crates.io",
  ".rust-lang.org",
  ".golang.org",
  ".go.dev",
  ".debian.org",
  ".ubuntu.com"
]
