name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Rich force-enables color when it detects GITHUB_ACTIONS; the suite's
      # output assertions are written against the plain rendering.
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Sync environment
        run: uv sync --quiet
      - name: Full gate (lint -> mypy -> pyright -> coverage)
        run: make check
