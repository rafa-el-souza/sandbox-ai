rc=0
sandbox workspace remove smoke dev2 --backup > /tmp/wsremove.out 2>&1
WRC=$?
echo "ws-remove exit: $WRC"
tail -20 /tmp/wsremove.out
[ "$WRC" -eq 0 ] && echo WS_REMOVE_EXIT0_OK || { echo WS_REMOVE_EXIT_NONZERO_FAIL; rc=1; }
sandbox workspace list smoke --no-backups --json > /tmp/wsremove_list.out 2>&1
if "$HOME/sandbox-ai/.venv/bin/python3" -c "import json,sys; d=json.load(open('/tmp/wsremove_list.out')); names=[w['name'] for w in d.get('workspaces',[])]; sys.exit(0 if 'dev2' not in names else 1)"; then echo WS_REMOVE_DEV2_GONE_OK; else echo WS_REMOVE_DEV2_REMAINS_FAIL; rc=1; cat /tmp/wsremove_list.out; fi
exit $rc
'''

