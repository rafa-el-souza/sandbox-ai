[[probe]]
id = "attach"
title = "`sandbox attach smoke main` (operator-rootless): drive PTY via script(1); land as agent in /workspaces/main"
tag = "mutating:host-root"
timeout = 300
classifies = "`sandbox attach smoke main` end-to-end: drives stdin through tlog-rec -> ssh -> /fwd -> core; PRIMARY gate is the agent shell prompt reaching /workspaces/main. The RWHOAMI/RPWD checks are observational."
run = '''
export XDG_RUNTIME_DIR=/run/user/$(id -u)
export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock
export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
command -v script >/dev/null 2>&1 && echo ATTACH_SCRIPT_TOOL_OK || { echo ATTACH_SCRIPT_TOOL_MISSING_FAIL; rc=1; }
echo '== confirm core running before attach =='
docker ps --format '{{.Names}}' | grep -q -- '-smoke-core-1' && echo ATTACH_PRECOND_CORE_RUNNING_OK || { echo ATTACH_PRECOND_CORE_NOT_RUNNING_FAIL; rc=1; }
echo '== drive sandbox attach in a PTY via script(1); timed so bash -l is ready =='
rm -f /tmp/attach.ts
SBX="$HOME/sandbox-ai/.venv/bin/sandbox"
{ sleep 6; printf 'echo RWHOAMI=$(whoami); echo RPWD=$(pwd)\n'; sleep 3; printf 'exit\n'; sleep 1; } | timeout 90 script -qec "$SBX attach smoke main" /tmp/attach.ts > /dev/null 2>&1
ARC=$?
echo "attach exit: $ARC"
echo '--- attach typescript (tail) ---'
tail -25 /tmp/attach.ts 2>/dev/null
echo '== PRIMARY: warm handover reached the agent shell in /workspaces/main =='
if grep -aq ':/workspaces/main' /tmp/attach.ts; then echo ATTACH_REACHED_WORKSPACE_OK; else echo ATTACH_REACHED_WORKSPACE_FAIL; rc=1; fi
echo '== SECONDARY (best-effort interactive drive) =='
grep -aq 'RWHOAMI=agent' /tmp/attach.ts && echo ATTACH_USER_AGENT_review || echo ATTACH_USER_review
grep -aq 'RPWD=/workspaces/main' /tmp/attach.ts && echo ATTACH_CMD_PWD_review || echo ATTACH_CMD_PWD_review
exit $rc
'''

[[probe]]
id = "stop"
title = "`sandbox stop smoke`: no smoke container after settle"
tag = "mutating:host-root"
classifies = "`sandbox stop smoke` -> exit 0 + no running `-smoke-` container after a ~30s settle/retry loop."
run = '''
export XDG_RUNTIME_DIR=/run/user/$(id -u)
export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock
export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
sandbox stop smoke > /tmp/stop.out 2>&1
STC=$?
echo "stop exit: $STC"
tail -15 /tmp/stop.out
[ "$STC" -eq 0 ] && echo STOP_EXIT0_OK || { echo STOP_EXIT_NONZERO_FAIL; rc=1; }
echo '== assert no smoke container after stop (settle/retry up to ~30s: arch teardown lags) =='
GONE=0
for i in $(seq 1 15); do
  if docker ps --format '{{.Names}}' 2>/dev/null | grep -q -- '-smoke-'; then sleep 2; else GONE=1; break; fi
done
if [ "$GONE" -eq 1 ]; then echo STOP_NO_CONTAINER_OK; else echo STOP_CONTAINER_STILL_RUNNING_FAIL; rc=1; docker ps --format '{{.Names}} {{.Status}}' | grep -i smoke; fi
exit $rc
'''

