[[probe]]
id = "destroy"
title = "`sandbox destroy smoke --force --backup-workspaces=none`: instance dir gone"
tag = "mutating:host-root"
classifies = "`sandbox destroy smoke --force --backup-workspaces=none` -> exit 0 + the instance dir $HOME/.sandbox-ai/instances/smoke is removed."
run = '''
export XDG_RUNTIME_DIR=/run/user/$(id -u)
export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock
export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
sandbox destroy smoke --force --backup-workspaces=none > /tmp/destroy.out 2>&1
DRC=$?
echo "destroy exit: $DRC"
tail -15 /tmp/destroy.out
[ "$DRC" -eq 0 ] && echo DESTROY_EXIT0_OK || { echo DESTROY_EXIT_NONZERO_FAIL; rc=1; }
echo '== assert instance dir gone =='
if [ -d "$HOME/.sandbox-ai/instances/smoke" ]; then echo DESTROY_INSTANCE_DIR_REMAINS_FAIL; rc=1; ls -la "$HOME/.sandbox-ai/instances/smoke" | tail -5; else echo DESTROY_INSTANCE_DIR_GONE_OK; fi
echo '== teardown leftovers (non-gating) =='
LC=$(docker ps -a --format '{{.Names}}' 2>/dev/null | grep -c -- '-smoke-')
echo "leftover_containers=$LC"
[ "$LC" = 0 ] && echo DESTROY_NO_LEFTOVER_CONTAINERS_review || echo DESTROY_LEFTOVER_CONTAINERS_review
exit $rc
'''
