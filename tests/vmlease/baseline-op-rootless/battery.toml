[[probe]]
id = "start"
title = "`sandbox start smoke --no-handover` (operator-rootless): core container running under the operator's rootless docker"
tag = "mutating:host-root"
timeout = 300
classifies = "`sandbox start smoke --no-handover` -> exit 0; no crossing error; the `-smoke-core-1` container is running under the operator's rootless docker. Leaves the instance running for status-running/attach."
run = '''
export XDG_RUNTIME_DIR=/run/user/$(id -u)
export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock
export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
echo '== start (no interactive handover) =='
sandbox start smoke --no-handover > /tmp/start.out 2>&1
SRC=$?
echo "start exit: $SRC"
tail -30 /tmp/start.out
[ "$SRC" -eq 0 ] && echo START_EXIT0_OK || { echo START_EXIT_NONZERO_FAIL; rc=1; }
echo '== crossing-error guard =='
if grep -qiE "Interactive authentication required|Exit sentinel not found|systemd error|failed to create task" /tmp/start.out; then echo START_CROSSING_ERROR_PRESENT_FAIL; rc=1; else echo START_NO_CROSSING_ERROR_OK; fi
echo '== assert the CORE container is running (op-rootless: docker ps as the operator with rootless DOCKER_HOST) =='
docker ps --format '{{.Names}} {{.Status}}' | grep -i smoke
if docker ps --format '{{.Names}}' 2>/dev/null | grep -q -- '-smoke-core-1'; then echo START_CORE_RUNNING_OK; else echo START_CORE_RUNNING_FAIL; rc=1; docker ps -a --format '{{.Names}} {{.Status}}' | grep -i smoke; fi
docker ps --filter "name=-smoke-core-1" --format '{{.Status}}' | grep -qiE 'healthy|Up' && echo START_CORE_HEALTHY_review || echo START_CORE_HEALTH_UNKNOWN_review
exit $rc
'''

