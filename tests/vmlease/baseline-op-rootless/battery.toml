name = "baseline-op-rootless"

[[probe]]
id = "PREP"
title = "install uv + source (uv sync) + tlog-rec per-distro + ensure script/pkttyagent + pre-seed sandbox-ai.toml (operator-rootless)"
tag = "mutating:operator-space"
timeout = 1800
classifies = "PRE-REQ: the `sandbox` CLI via `uv sync` from the uploaded source tarball, tlog-rec per-distro (L0 hard prereq + attach session recorder), script(1)/pkttyagent present, and a per-operator operator-rootless sandbox-ai.toml ([host].docker_unprivileged_user = the operator, machinectl_authentication = sudo)."
run = '''
echo '== install uv =='
curl -LsSf https://astral.sh/uv/install.sh | sh
. "$HOME/.local/bin/env" 2>/dev/null || . "$HOME/.cargo/env" 2>/dev/null || true
export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
uv --version || { echo PREP_UV_FAIL; exit 1; }
echo '== uploaded source tarball present? =='
TARBALL=$(ls "$HOME"/sandbox-ai-src*.tar.gz 2>/dev/null | head -1)
[ -n "$TARBALL" ] || { echo PREP_TARBALL_MISSING; exit 1; }
echo '== extract + uv sync =='
rm -rf "$HOME/sandbox-ai"
mkdir -p "$HOME/sandbox-ai"
tar -xzf "$TARBALL" -C "$HOME/sandbox-ai"
uv sync --directory "$HOME/sandbox-ai" 2>&1 | tail -6
"$HOME/sandbox-ai/.venv/bin/sandbox" --help >/dev/null 2>&1 && echo PREP_SANDBOX_INSTALLED_OK || { echo PREP_SANDBOX_INSTALL_FAIL; exit 1; }
echo '== install tlog-rec per-distro (best-effort; failure -> L0 refuses, which is a separate finding) =='
. /etc/os-release
if command -v tlog-rec >/dev/null 2>&1; then
  echo 'tlog-rec already present'
else
  (
    case "${ID:-}" in
      ubuntu)
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tlog
        ;;
      debian)
        maj=$(echo "${VERSION_ID:-0}" | cut -d. -f1)
        if [ "${maj:-0}" -le 12 ] 2>/dev/null; then
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tlog
        else
          echo "debian ${VERSION_ID}: source-building tlog"
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential autoconf automake libtool m4 pkg-config git libjson-c-dev libsystemd-dev libcurl4-openssl-dev libutempter-dev
          T=$(mktemp -d)
          git clone --depth=1 https://github.com/Scribery/tlog "$T/tlog"
          cd "$T/tlog" && autoreconf -i -f && ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var && make -j"$(nproc)" && sudo make install && sudo ldconfig
        fi
        ;;
      fedora)
        sudo dnf -y install tlog
        ;;
      arch|manjaro)
        if command -v paru >/dev/null 2>&1; then
          paru -S --noconfirm tlog
        elif command -v yay >/dev/null 2>&1; then
          yay -S --noconfirm tlog
        else
          sudo pacman -Sy --needed --noconfirm base-devel git
          T=$(mktemp -d)
          git clone --depth=1 https://aur.archlinux.org/yay.git "$T/yay"
          cd "$T/yay" && makepkg -si --noconfirm && yay -S --noconfirm tlog
        fi
        ;;
    esac
  ) || echo 'tlog install step returned non-zero'
fi
command -v tlog-rec >/dev/null 2>&1 && echo PREP_TLOG_OK || echo PREP_TLOG_MISSING_review
echo '== ensure script(1) + pkttyagent present (PTY drive + polkit agent) =='
command -v script >/dev/null 2>&1 && echo PREP_SCRIPT_OK || {
  echo 'installing util-linux/script'
  (
    case "${ID:-}" in
      ubuntu|debian)
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bsdutils util-linux
        ;;
      fedora)
        sudo dnf -y install util-linux
        ;;
      arch|manjaro)
        sudo pacman -Sy --needed --noconfirm util-linux
        ;;
    esac
  ) >/dev/null 2>&1
  command -v script >/dev/null 2>&1 && echo PREP_SCRIPT_OK || echo PREP_SCRIPT_MISSING_review
}
command -v pkttyagent >/dev/null 2>&1 && echo PREP_PKTTYAGENT_OK || echo PREP_PKTTYAGENT_MISSING_review
echo '== pre-seed per-operator sandbox-ai.toml: operator-rootless daemon owner = the operator =='
OP=$(id -un)
mkdir -p "$HOME/.sandbox-ai/config"
printf '[host]\ndocker_unprivileged_user = "%s"\nmachinectl_authentication = "sudo"\n' "$OP" > "$HOME/.sandbox-ai/config/sandbox-ai.toml"
echo "seeded toml for operator: $OP"
cat "$HOME/.sandbox-ai/config/sandbox-ai.toml"
echo '== provenance =='
"$HOME/sandbox-ai/.venv/bin/sandbox" --version 2>/dev/null || echo 'sandbox --version: n/a'
uname -r
systemctl --version | head -1
. /etc/os-release
echo "DISTRO=${ID:-?} VERSION_ID=${VERSION_ID:-?}"
echo PREP_PROVENANCE_review
echo PREP_TOML_SEEDED_OK
'''

[[probe]]
id = "setup"
title = "operator-rootless setup: `sandbox setup --docker-execution-mode operator-rootless --yes` AS THE OPERATOR (op-rootless refuses root; it self-escalates the host-root batch via `sudo -n sandbox _bootstrap-host`)"
tag = "mutating:host-root"
timeout = 1200
classifies = "Provision a converged operator-rootless host: exit 0 + 'Setup complete' + the /usr/local/libexec/sandbox-ai/setup-state.json marker + no 'Exit sentinel not found' empty-crossing."
run = '''
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
OP=$(id -un)
echo "operator: $OP -- op-rootless setup MUST run as the operator (NO sudo); it escalates the host-root batch internally via 'sudo -n sandbox _bootstrap-host'"
rm -f /tmp/setup.out
echo '== sandbox setup --docker-execution-mode operator-rootless --yes (as operator) =='
sandbox setup --docker-execution-mode operator-rootless --yes 2>&1 | tee /tmp/setup.out
RC=${PIPESTATUS[0]}
echo "setup exit: $RC (0 expected)"
tail -30 /tmp/setup.out
[ "$RC" -eq 0 ] && echo SETUP_EXIT0_OK || { echo SETUP_EXIT_NONZERO_FAIL; rc=1; }
grep -qiE "Setup complete|Summary:.*0 failed" /tmp/setup.out && echo SETUP_COMPLETE_OK || { echo SETUP_NO_COMPLETE_FAIL; rc=1; }
echo '== setup-state marker present =='
if sudo test -f /usr/local/libexec/sandbox-ai/setup-state.json; then echo SETUP_MARKER_PRESENT_OK; else echo SETUP_MARKER_MISSING_FAIL; rc=1; fi
echo '== sentinel guard: "Exit sentinel not found" must be ABSENT =='
if grep -qiE "Exit sentinel not found" /tmp/setup.out; then echo SETUP_SENTINEL_PRESENT_FAIL; rc=1; else echo SETUP_NO_SENTINEL_OK; fi
exit $rc
'''

[[probe]]
id = "init"
title = "`sandbox init smoke --empty main` + seed dummy secrets; instance dir present"
tag = "mutating:host-root"
classifies = "`sandbox init smoke --empty main` -> exit 0 + instance dir created; dummy CORE secrets seeded for the start gate."
run = '''
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
echo '== init (non-TTY stdin) =='
sandbox init smoke --empty main < /dev/null > /tmp/init.out 2>&1
IRC=$?
echo "init exit: $IRC"
tail -20 /tmp/init.out
[ "$IRC" -eq 0 ] && echo INIT_EXIT0_OK || { echo INIT_EXIT_NONZERO_FAIL; rc=1; }
echo '== seed dummy secrets so the start secret-completeness gate passes =='
ENVF="$HOME/.sandbox-ai/instances/smoke/.sandbox.env"
if [ -f "$ENVF" ]; then
  sed -i 's#^CORE_ANTHROPIC_API_KEY=.*#CORE_ANTHROPIC_API_KEY="sk-ant-dummy0000000000000000000000000000"#; s#^CORE_GITHUB_TOKEN=.*#CORE_GITHUB_TOKEN="ghp_dummy00000000000000000000000000000000"#' "$ENVF" && echo INIT_SECRETS_SEEDED_OK
else
  echo INIT_NO_ENV_FILE_review
fi
echo '== assert instance dir present =='
if [ -d "$HOME/.sandbox-ai/instances/smoke" ]; then echo INIT_INSTANCE_DIR_PRESENT_OK; else echo INIT_INSTANCE_DIR_MISSING_FAIL; rc=1; fi
exit $rc
'''

