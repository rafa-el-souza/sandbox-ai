name = "multi-operator-oprootless-first"

# =============================================================================
# Multi-operator validation battery — OP-ROOTLESS FIRST arc.
#
# PURPOSE
#   Real multi-operator host repro for two coupled defects in the host-level
#   shared-namespace allocation. The existing single-operator baselines run as
#   ONE operator (the vmlease `probe` user); they cannot surface a collision
#   that only manifests when a SECOND operator provisions on the same host.
#   This battery creates SEPARATE per-bug OS operators and drives their own
#   per-operator `sandbox` installs.
#
# SCHEMA MIGRATION (vmlease requires/[prep]):
#   - root `requires = ["docker"]` installs docker-ce + rootless extras.
#   - the op1 PREP probe is hoisted into [prep]: util-linux via [prep.packages];
#     uv-install / uv-sync / tlog as ordered [[prep.setup]] script= steps. The
#     PREP provenance block + the op1 [host] config-seed are DROPPED (covered by
#     vmlease's _detail snapshot; [host] retired under C-013).
#   - mk-op2 / mk-op3f (pure-provisioning) are hoisted into ordered required=true
#     [[prep.setup]] steps; their per-operator [host] seeds are DROPPED.
#   - op4's PURE CREATION (useradd + sudoers + linger + op4 uv sync) is hoisted
#     into the required=true `mk-op4` [[prep.setup]] step (its [host] seed
#     DROPPED). op4's `sandbox setup --separate-user` + the F-071 overlap
#     assertion + the L2 guard REMAIN the `mixed-subid-overlap-and-guard` probe,
#     ordered AFTER op1-setup (the assert reads /tmp/op1.subuid written by
#     op1-setup) — hoisting op4's setup would invert/destroy the F-071 coverage.
#
# (Full DEFECTS-UNDER-TEST / GATING / per-probe verdict narrative preserved in
#  the original sandbox-ai battery; see F-070 / F-071 commentary on each probe.)
# =============================================================================

requires = ["docker"]

[prep.packages]
apt = ["bsdutils", "util-linux"]
dnf = ["util-linux"]
pacman = ["util-linux"]

[[prep.setup]]
id = "uv-install"
title = "install uv for the probe operator op1 (op1 HOME)"
required = true
script = "prep/uv-install.sh"

[[prep.setup]]
id = "uv-sync"
title = "op1 extract uploaded source tarball + uv sync -> sandbox CLI"
required = true
script = "prep/uv-sync.sh"

[[prep.setup]]
id = "install-helpers"
title = "install the shared probe-helper library to /tmp/sbai-helpers.sh (bridge-group resolver + forensic dump + teardown sentinel)"
required = true
script = "prep/install-helpers.sh"

[[prep.setup]]
id = "tlog"
title = "install tlog-rec per-distro (best-effort; L0 refusal is a separate finding)"
required = false
script = "prep/tlog.sh"

[[prep.setup]]
id = "mk-operators"
title = "create the extra operators (useradd + sudoers + linger + per-operator uv sync)"
required = true
script = "prep/mk-operators.sh"

[[probe]]
id = "op1-setup"
title = "op1 operator-rootless setup: `sandbox setup --docker-execution-mode operator-rootless --yes` AS op1 (the probe operator); capture op1 subid ranges + the created sb-ws gid"
tag = "mutating:host-root"
timeout = 1200
classifies = "Provision the host op-rootless as op1: exit 0 + 'Setup complete' + the setup-state marker. Capture op1's /etc/subuid + /etc/subgid ranges and the created `sb-ws` gid into /tmp/op1.* for the later cross-operator asserts. op-rootless setup MUST run as the operator (NO sudo); it self-escalates the host-root batch via 'sudo -n sandbox _bootstrap-host'."
run = '''
# unset SUDO_* so `sandbox` resolves the operator as the CURRENT user (op2/op3f), not the
# probe user that `sudo -iu` records in SUDO_USER (l0_identity precedence: --operator -> $SUDO_USER
# -> current). This RESTORES fidelity to the real scenario (opN logs in directly, no SUDO_USER).
unset SUDO_USER SUDO_UID SUDO_GID PKEXEC_UID
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
. /tmp/sbai-helpers.sh
rc=0
OP1=$(id -un)
echo "operator: $OP1 -- op-rootless setup runs as the operator (it escalates the host-root batch internally)"
rm -f /tmp/setup1.out
echo '== sandbox setup --docker-execution-mode operator-rootless --yes (as op1) =='
sandbox setup --docker-execution-mode operator-rootless --yes 2>&1 | tee /tmp/setup1.out
RC=${PIPESTATUS[0]}
echo "op1 setup exit: $RC (0 expected)"
tail -20 /tmp/setup1.out
[ "$RC" -eq 0 ] && echo OP1_SETUP_EXIT0_OK || { echo OP1_SETUP_EXIT_NONZERO_FAIL; rc=1; }
grep -qiE "Setup complete|Summary:.*0 failed" /tmp/setup1.out && echo OP1_SETUP_COMPLETE_OK || { echo OP1_SETUP_NO_COMPLETE_FAIL; rc=1; }
if sudo test -f /usr/local/libexec/sandbox-ai/setup-state.json; then echo OP1_SETUP_MARKER_PRESENT_OK; else echo OP1_SETUP_MARKER_MISSING_FAIL; rc=1; fi
echo '== capture op1 /etc/subuid + /etc/subgid ranges (raw, for cross-operator compare) =='
OP1_SUBUID=$(grep -E "^${OP1}:" /etc/subuid 2>/dev/null | head -1)
OP1_SUBGID=$(grep -E "^${OP1}:" /etc/subgid 2>/dev/null | head -1)
printf '%s\n' "$OP1_SUBUID" > /tmp/op1.subuid
printf '%s\n' "$OP1_SUBGID" > /tmp/op1.subgid
echo "OP1_SUBUID_LINE=${OP1_SUBUID:-<none>} OP1_REVIEW_review"
echo "OP1_SUBGID_LINE=${OP1_SUBGID:-<none>} OP1_REVIEW_review"
echo '== capture op1 per-operator bridge group via the marker resolver (op-rootless: sb-ws-<op1>) =='
# Read the group NAME op1 actually uses from its setup-state marker entry (the runtime
# source of truth), NOT a hard-coded `getent group sb-ws` — op-rootless creates the
# PER-OPERATOR `sb-ws-<op1>`, so the shared `sb-ws` never exists in this mode.
SBWS_NAME=$(sbai_bridge_group "$OP1")
SBWS_GID=$(sbai_bridge_gid "$OP1")
printf '%s\n' "$SBWS_GID" > /tmp/sbws.gid
echo "OP1_BRIDGE_GROUP=${SBWS_NAME:-<none>} gid=${SBWS_GID:-<none>} OP1_SBWS_review"
[ -n "$SBWS_GID" ] && echo OP1_SBWS_PRESENT_OK || { echo OP1_SBWS_ABSENT_FAIL; rc=1; }
exit $rc
'''

[[probe]]
id = "op2-setup"
title = "op2 operator-rootless setup (the SILENT-ACCEPT case): `sandbox setup --docker-execution-mode operator-rootless --yes` AS op2; record exit + unchanged sb-ws gid + the silent-accept membership"
tag = "mutating:host-root"
timeout = 1200
classifies = "op2 provisions op-rootless on the SAME host where op1 already created the shared `sb-ws`. On HEAD setup EXITS 0 (host_batch._group_satisfied checks only existence+membership, never gid-in-range, so the colliding group is silently accepted) AND makes op2 a MEMBER of sb-ws even though its gid is outside op2's subgid range — that membership is the silent-accept evidence (the run-1 gap we are closing). Exit + membership are RECORDED observationally, NOT gated (gating on them would wrongly pass on HEAD). The real gates are the bridge-gid/range asserts that follow. Uses the script-file pattern so setup ACTUALLY runs (sudo -i collapses a multiline arg)."
run = '''
. /tmp/sbai-helpers.sh
echo '== sandbox setup as op2 (op-rootless, runs as the operator op2) =='
OP1=$(id -un)
# Snapshot op1's PER-OPERATOR bridge gid (op-rootless created sb-ws-<op1>, NOT a shared
# sb-ws); op2's op-rootless setup must not disturb another operator's group.
SBWS_OP1_BEFORE=$(sbai_bridge_gid "$OP1")
echo "op1 bridge gid before op2 setup: ${SBWS_OP1_BEFORE:-<none>} OP2_SETUP_review"
# script-file pattern: write as probe user, run as op2 with a single path arg (no sudo -i newline collapse).
cat > /tmp/op2_setup.sh <<'SCRIPT'
export XDG_RUNTIME_DIR="/run/user/$(id -u)"
export DOCKER_HOST="unix://${XDG_RUNTIME_DIR}/docker.sock"
# unset SUDO_* so `sandbox` resolves the operator as the CURRENT user (op2/op3f), not the
# probe user that `sudo -iu` records in SUDO_USER (l0_identity precedence: --operator -> $SUDO_USER
# -> current). This RESTORES fidelity to the real scenario (opN logs in directly, no SUDO_USER).
unset SUDO_USER SUDO_UID SUDO_GID PKEXEC_UID
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
sandbox setup --docker-execution-mode operator-rootless --yes
SCRIPT
chmod 0755 /tmp/op2_setup.sh
sudo -iu op2 bash /tmp/op2_setup.sh > /tmp/op2_setup.out 2>&1
RC=$?
echo "op2 setup exit: $RC"
tail -25 /tmp/op2_setup.out
echo "== HEAD expectation: exit 0 (silent-accept). Recorded, NOT gated. =="
if [ "$RC" -eq 0 ]; then echo OP2_SETUP_EXIT0_review; else echo OP2_SETUP_EXIT_NONZERO_review; fi
echo '== confirm op2 setup did not disturb op1 per-operator bridge group =='
SBWS_OP1_AFTER=$(sbai_bridge_gid "$OP1")
echo "op1 bridge gid after op2 setup: ${SBWS_OP1_AFTER:-<none>} OP2_SETUP_review"
if [ "$SBWS_OP1_BEFORE" = "$SBWS_OP1_AFTER" ]; then echo OP2_OP1_BRIDGE_UNCHANGED_review; else echo OP2_OP1_BRIDGE_CHANGED_review; fi
echo '== op2 own per-operator bridge group (op-rootless: sb-ws-op2, in op2 range) =='
OP2_BRIDGE_NAME=$(sbai_bridge_group op2)
OP2_BRIDGE_GID=$(sbai_bridge_gid op2)
echo "op2 bridge group=${OP2_BRIDGE_NAME:-<none>} gid=${OP2_BRIDGE_GID:-<none>} OP2_SETUP_review"
echo '== SILENT-ACCEPT regression evidence: op2 a MEMBER of the SHARED sb-ws at an OUT-OF-RANGE gid =='
# Exact-token match on `sb-ws` (NOT the per-operator `sb-ws-op2`, which shares the prefix
# and is op2's CORRECT group); AND require the shared group gid to be OUTSIDE op2's subgid
# range. Mere membership of op2's own correctly-ranged group is NOT a silent accept (#7).
SHARED_SBWS_GID=$(getent group sb-ws 2>/dev/null | cut -d: -f3)
OP2_SUBGID=$(grep -E "^op2:" /etc/subgid 2>/dev/null | head -1)
if id -nG op2 2>/dev/null | tr ' ' '\n' | grep -qx sb-ws && [ -n "$SHARED_SBWS_GID" ] && [ -n "$OP2_SUBGID" ]; then
  S2=$(printf '%s' "$OP2_SUBGID" | cut -d: -f2); C2=$(printf '%s' "$OP2_SUBGID" | cut -d: -f3)
  case "$SHARED_SBWS_GID$S2$C2" in
    *[!0-9]*|'') echo "shared sb-ws / op2 range unparseable OP2_SETUP_review" ;;
    *) E2=$((S2 + C2));
       if [ "$SHARED_SBWS_GID" -ge "$S2" ] && [ "$SHARED_SBWS_GID" -lt "$E2" ]; then
         echo "op2 in shared sb-ws but gid $SHARED_SBWS_GID is IN op2 range -- not a collision OP2_SETUP_review"
       else
         echo "op2 is a member of the SHARED sb-ws gid $SHARED_SBWS_GID, OUTSIDE op2 range [$S2,$E2) -- silent accept"
         echo MU_OP2_SILENT_ACCEPT_review
       fi ;;
  esac
else
  echo "op2 is NOT a member of a colliding shared sb-ws (uses its own ${OP2_BRIDGE_NAME:-<none>}) OP2_SETUP_review"
fi
# Always succeed: this probe only records observational state for the gates that follow.
exit 0
'''

[[probe]]
id = "op2-bridge-gid-assert"
title = "F-070 CORE GATE: the `sb-ws` gid IS within op2's /etc/subgid range"
tag = "mutating:host-root"
timeout = 120
classifies = "F-070 bridge-gid collision core assertion, re-aimed at the group op2 ACTUALLY uses. POST-FIX-CORRECT condition: op2's marker-recorded bridge group (op-rootless: the per-operator sb-ws-op2) has a live gid inside op2's /etc/subgid range (so op2's rootless docker can use it as --group-add) -> _OK. A regression that adopts a group whose gid sits outside op2's range -> _FAIL (RED) and the observational token MU_OP2_BRIDGE_GID_OUT_OF_RANGE is emitted. The group NAME is resolved from op2's setup-state marker entry (the runtime source of truth) via the shared resolver, NOT a hard-coded `getent group sb-ws` (which named a shared group that does not exist in op-rootless mode and died on ABSENT before comparing anything). Raw gid + op2 range emitted as _review."
run = '''
. /tmp/sbai-helpers.sh
rc=0
echo '== resolve op2 bridge group from the marker (the group op2 ACTUALLY uses) + op2 subgid range =='
# F-070 core assertion, re-aimed: the OLD `getent group sb-ws` tested a shared group that
# does NOT exist in op-rootless mode (op2 uses the per-operator sb-ws-op2), so it died on
# ABSENT before comparing anything. The resolver reads op2's recorded bridge group name
# from its setup-state marker entry (the runtime source of truth) and getents its live gid.
SBWS_NAME=$(sbai_bridge_group op2)
SBWS_GID=$(sbai_bridge_gid op2)
OP2_SUBGID=$(grep -E "^op2:" /etc/subgid 2>/dev/null | head -1)
echo "OP2_BRIDGE_GROUP=${SBWS_NAME:-<none>} SBWS_GID=${SBWS_GID:-<none>} BRIDGE_review"
echo "OP2_SUBGID=${OP2_SUBGID:-<none>} BRIDGE_review"
if [ -z "$SBWS_GID" ]; then echo BRIDGE_SBWS_ABSENT_FAIL; exit 1; fi
if [ -z "$OP2_SUBGID" ]; then echo BRIDGE_OP2_SUBGID_ABSENT_FAIL; exit 1; fi
S2=$(printf '%s' "$OP2_SUBGID" | cut -d: -f2)
C2=$(printf '%s' "$OP2_SUBGID" | cut -d: -f3)
case "$SBWS_GID$S2$C2" in
  *[!0-9]*|'') echo BRIDGE_UNPARSEABLE_FAIL; exit 1 ;;
esac
E2=$((S2 + C2))
echo "op2 subgid range: [$S2, $E2)  $SBWS_NAME gid: $SBWS_GID"
if [ "$SBWS_GID" -ge "$S2" ] && [ "$SBWS_GID" -lt "$E2" ]; then
  echo BRIDGE_GID_IN_OP2_RANGE_OK
else
  echo BRIDGE_GID_OUT_OF_OP2_RANGE_FAIL
  echo MU_OP2_BRIDGE_GID_OUT_OF_RANGE_review
  rc=1
fi
exit $rc
'''

[[probe]]
id = "op2-doctor"
title = "`sandbox doctor --user op2`: NO bridge-gid-out-of-range violation"
tag = "mutating:host-root"
timeout = 180
classifies = "doctor's setup-invariants audit (setup_invariants._audit_subid_and_group) flags 'bridge group sb-ws gid <n> outside op2's /etc/subgid range'. POST-FIX-CORRECT: doctor --user op2 exits 0 with NO such violation -> _OK. On HEAD the violation is present (and exit non-zero) -> _FAIL (RED). NOTE: the execution-mode marker is host-global (root-owned, last-writer-wins); we pass --user op2 explicitly (which wins in both modes) so the audit targets op2's ranges regardless of which operator wrote the marker last."
run = '''
. /tmp/sbai-helpers.sh
rc=0
echo '== sandbox doctor --user op2 (run as op2 against op2 ranges) =='
cat > /tmp/op2_doctor.sh <<'SCRIPT'
# unset SUDO_* so `sandbox` resolves the operator as the CURRENT user (op2/op3f), not the
# probe user that `sudo -iu` records in SUDO_USER (l0_identity precedence: --operator -> $SUDO_USER
# -> current). This RESTORES fidelity to the real scenario (opN logs in directly, no SUDO_USER).
unset SUDO_USER SUDO_UID SUDO_GID PKEXEC_UID
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
sandbox doctor --user op2
SCRIPT
chmod 0755 /tmp/op2_doctor.sh
sudo -iu op2 bash /tmp/op2_doctor.sh > /tmp/op2_doctor.out 2>&1
DRC=$?
echo "doctor exit: $DRC"
cat /tmp/op2_doctor.out
echo '== narrow gate: a ✗ (hard-fail) row on op2 bridge gid / subgid range =='
# Gate ONLY on a red ✗ subgid/bridge violation. A ⚠ (yellow) advisory about the stale
# shared sb-ws is NOT op2's bridge failure and must not gate (#3/#4). ACL/registry/
# init-ordering ✗ rows are env/ordering artifacts that the helper excludes (surfaced
# as _review below), so they no longer trip this purpose-narrow gate.
HARD=$(sbai_doctor_hard_violations /tmp/op2_doctor.out)
if printf '%s\n' "$HARD" | grep -qiE "subgid range|bridge group .* outside|out of .*subgid"; then
  echo DOCTOR_BRIDGE_GID_VIOLATION_PRESENT_FAIL
  echo MU_OP2_BRIDGE_GID_OUT_OF_RANGE_review
  rc=1
else
  echo DOCTOR_NO_BRIDGE_GID_VIOLATION_OK
fi
echo '== observational: stale shared-sb-ws ⚠ advisory (NOT gated) =='
if grep -E "⚠" /tmp/op2_doctor.out 2>/dev/null | grep -qiE "sb-ws|bridge group"; then echo DOCTOR_SHARED_SBWS_ADVISORY_review; fi
echo '== observational: ✗ rows EXCLUDED from the gate (env capability / network / init-ordering) =='
grep '✗' /tmp/op2_doctor.out 2>/dev/null | grep -iE "ACL support|image digest|registry|state dir writable|per-user tree exists" && echo DOCTOR_ENV_OR_ORDERING_ROWS_review || true
echo '== whole-doctor exit recorded observationally (NOT gated: it conflates env/network/init-ordering) =='
[ "$DRC" -eq 0 ] && echo DOCTOR_EXIT0_review || echo DOCTOR_EXIT_NONZERO_review
exit $rc
'''

[[probe]]
id = "op2-start"
title = "op2 `sandbox init` + `sandbox start`: op2's core container runs under op2's rootless docker"
tag = "mutating:host-root"
timeout = 600
classifies = "End-to-end op2 runtime. POST-FIX-CORRECT: op2 can init + start an instance and `-mu2-core-1` runs under op2's rootless docker (docker ps with op2's XDG_RUNTIME_DIR + DOCKER_HOST) -> _OK. On HEAD start fails (workspace_bridge_gid -> in_container_gid_for_host_gid raises SubgidOutOfRangeError because sb-ws gid is outside op2's range) -> _FAIL (RED). Uses instance name `mu2` to avoid colliding with op1's namespace; seeds dummy secrets like the baseline init."
run = '''
. /tmp/sbai-helpers.sh
rc=0
OP2_UID=$(id -u op2)
echo '== op2 init (non-TTY) + seed dummy secrets =='
cat > /tmp/op2_init.sh <<'SCRIPT'
# unset SUDO_* so `sandbox` resolves the operator as the CURRENT user (op2/op3f), not the
# probe user that `sudo -iu` records in SUDO_USER (l0_identity precedence: --operator -> $SUDO_USER
# -> current). This RESTORES fidelity to the real scenario (opN logs in directly, no SUDO_USER).
unset SUDO_USER SUDO_UID SUDO_GID PKEXEC_UID
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
sandbox init mu2 --empty main < /dev/null 2>&1
ENVF="$HOME/.sandbox-ai/instances/mu2/.sandbox.env"
if [ -f "$ENVF" ]; then
  sed -i 's#^CORE_ANTHROPIC_API_KEY=.*#CORE_ANTHROPIC_API_KEY="sk-ant-dummy0000000000000000000000000000"#; s#^CORE_GITHUB_TOKEN=.*#CORE_GITHUB_TOKEN="ghp_dummy00000000000000000000000000000000"#' "$ENVF"
fi
SCRIPT
chmod 0755 /tmp/op2_init.sh
sudo -iu op2 bash /tmp/op2_init.sh > /tmp/op2_init.out 2>&1
IRC=$?
echo "op2 init exit: $IRC"
tail -15 /tmp/op2_init.out
[ "$IRC" -eq 0 ] && echo OP2_INIT_EXIT0_OK || { echo OP2_INIT_EXIT_NONZERO_FAIL; rc=1; }
echo '== op2 start (no interactive handover) =='
cat > /tmp/op2_start.sh <<'SCRIPT'
export XDG_RUNTIME_DIR="/run/user/$(id -u)"
export DOCKER_HOST="unix://${XDG_RUNTIME_DIR}/docker.sock"
export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
# unset SUDO_* so `sandbox` resolves the operator as the CURRENT user (op2/op3f), not the
# probe user that `sudo -iu` records in SUDO_USER (l0_identity precedence: --operator -> $SUDO_USER
# -> current). This RESTORES fidelity to the real scenario (opN logs in directly, no SUDO_USER).
unset SUDO_USER SUDO_UID SUDO_GID PKEXEC_UID
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
sandbox start mu2 --no-handover
SCRIPT
chmod 0755 /tmp/op2_start.sh
sudo -iu op2 bash /tmp/op2_start.sh > /tmp/op2_start.out 2>&1
SRC=$?
echo "op2 start exit: $SRC"
tail -30 /tmp/op2_start.out
# Start exit is OBSERVATIONAL: a non-zero exit here is currently driven by the core
# container's exit-126 whose cause is uncharacterized (#9) — captured below, not gated.
[ "$SRC" -eq 0 ] && echo OP2_START_EXIT0_review || echo OP2_START_EXIT_NONZERO_review
echo '== F-070 GATE: SubgidOutOfRangeError must be ABSENT (post per-operator fix) =='
if grep -qiE "SubgidOutOfRange|outside .*subgid|out of .*subgid range" /tmp/op2_start.out; then
  echo OP2_START_SUBGID_ERROR_PRESENT_FAIL
  echo MU_OP2_BRIDGE_GID_OUT_OF_RANGE_review
  rc=1
else
  echo OP2_START_NO_SUBGID_ERROR_OK
fi
echo '== op2 core container under op2 rootless docker (OBSERVATIONAL until the exit-126 cause is characterized, #9) =='
# The OP2_START_NO_SUBGID_ERROR_OK + core-down contradiction proved the OLD hard gate
# tested a failure mode the per-operator fix already removed. Core health is recorded,
# NOT gated, until the forensic dump (below) lets us classify the 126 cause.
CT=$(sudo -u op2 env XDG_RUNTIME_DIR="/run/user/${OP2_UID}" DOCKER_HOST="unix:///run/user/${OP2_UID}/docker.sock" docker ps --format '{{.Names}}' 2>&1 | tr -d '\r')
echo "op2 containers: $CT"
if printf '%s' "$CT" | grep -q -- '-mu2-core-1'; then
  echo OP2_CORE_RUNNING_review
else
  echo OP2_CORE_NOT_RUNNING_review
  echo '== forensic capture of the non-running core BEFORE the probe exits + mark for teardown guard (#1/#3) =='
  CTR=$(sudo -u op2 env XDG_RUNTIME_DIR="/run/user/${OP2_UID}" DOCKER_HOST="unix:///run/user/${OP2_UID}/docker.sock" docker ps -a --format '{{.Names}}' 2>/dev/null | tr -d '\r' | grep -- '-mu2-core-1' | head -1)
  CTR=${CTR:--mu2-core-1}
  sbai_forensic_dump op2 "$CTR"
  sbai_mark_forensics op2 "$CTR"
fi
exit $rc
'''

[[probe]]
id = "op3f-setup"
title = "op3f operator-rootless setup (entry-less): `sandbox setup --docker-execution-mode operator-rootless --yes` AS op3f; setup FAILS LOUD with NoSubgidRangeError before any subid append"
tag = "mutating:host-root"
timeout = 1200
classifies = "op3f provisions op-rootless with NO pre-existing /etc/subuid+/etc/subgid entries (stripped in mk-op3f). RE-AIM: classify_host_root_batch (host_batch.py:440) calls autodetect_workspace_bridge_gid_recommendation BEFORE the subid classify, so the entry-less op-rootless path FAILS LOUD with NoSubgidRangeError (host_config.py:597, 'cannot recommend a bridge gid') and NEVER reaches the literal subid append -- it does NOT silently overlap op1. Exit recorded observationally (_review), NOT gated; the loud failure is then asserted (as acceptable behavior) by the op3f-loud-assert probe that follows. Uses the script-file pattern so setup ACTUALLY runs (sudo -i collapses a multiline arg)."
run = '''
echo '== sandbox setup as op3f (op-rootless, entry-less precondition -> setup FAILS LOUD before any append) =='
# script-file pattern: write as probe user, run as op3f with a single path arg (no sudo -i newline collapse).
cat > /tmp/op3f_setup.sh <<'SCRIPT'
export XDG_RUNTIME_DIR="/run/user/$(id -u)"
export DOCKER_HOST="unix://${XDG_RUNTIME_DIR}/docker.sock"
# unset SUDO_* so `sandbox` resolves the operator as the CURRENT user (op2/op3f), not the
# probe user that `sudo -iu` records in SUDO_USER (l0_identity precedence: --operator -> $SUDO_USER
# -> current). This RESTORES fidelity to the real scenario (opN logs in directly, no SUDO_USER).
unset SUDO_USER SUDO_UID SUDO_GID PKEXEC_UID
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
sandbox setup --docker-execution-mode operator-rootless --yes
SCRIPT
chmod 0755 /tmp/op3f_setup.sh
sudo -iu op3f bash /tmp/op3f_setup.sh > /tmp/op3f_setup.out 2>&1
RC=$?
echo "op3f setup exit: $RC"
tail -25 /tmp/op3f_setup.out
echo "== exit recorded, NOT gated (the subid-overlap-assert is the F-071 gate). =="
if [ "$RC" -eq 0 ]; then echo OP3F_SETUP_EXIT0_review; else echo OP3F_SETUP_EXIT_NONZERO_review; fi
echo '== record op3f subid entries appended by setup =='
grep -E "^op3f:" /etc/subuid /etc/subgid 2>/dev/null || echo 'op3f subid entries: <none> OP3F_SETUP_review'
# Always succeed: this probe only records observational state for the gate that follows.
exit 0
'''

[[probe]]
id = "op3f-loud-assert"
title = "OBSERVATIONAL: op3f's entry-less op-rootless setup FAILED LOUD with a subid-range error (acceptable behavior, NOT the F-071 red gate)"
tag = "mutating:host-root"
timeout = 120
classifies = "Re-aim (grounded in code, confirmed by smoke): the op-rootless ENTRY-LESS path does NOT produce a silent subid overlap. classify_host_root_batch (host_batch.py:440) calls autodetect_workspace_bridge_gid_recommendation(operator) BEFORE the subid classify, so an operator with no /etc/subgid entry FAILS LOUD with NoSubgidRangeError (host_config.py:597, message 'cannot recommend a bridge gid') and NEVER reaches the literal subid append. That loud failure is ACCEPTABLE behavior, not a bug. This probe documents it: it asserts op3f-setup failed loud with a subid-range error (-> OP3F_LOUD_FAIL_OK) and additionally flags the mis-worded 'cannot recommend a bridge gid' message as OP3F_MESSAGE_MISLEADING_review (the #8 clarity fix should reword it to mention the missing subid entry directly). PASSES on HEAD: this is documentation of acceptable-but-mis-worded loud-fail, NOT the F-071 silent-overlap gate. The REAL F-071 silent-overlap gate is the separate-user path in `mixed-subid-overlap-and-guard`. Raw gid/range values emitted as _review."
run = '''
rc=0
echo '== inspect op3f entry-less op-rootless setup output (captured in op3f-setup) =='
if [ ! -f /tmp/op3f_setup.out ]; then
  echo OP3F_SETUP_OUT_MISSING_FAIL
  exit 1
fi
tail -25 /tmp/op3f_setup.out
echo '== raw op3f subid entries (should be ABSENT: setup never reached the literal append) =='
grep -E "^op3f:" /etc/subuid /etc/subgid 2>/dev/null || echo 'op3f subid entries: <none> OP3F_LOUD_review'
echo '== assert: setup failed LOUD with a subid-range error (acceptable behavior) =='
if grep -qiE "NoSubgidRangeError|no /etc/subgid entry|cannot recommend a bridge gid" /tmp/op3f_setup.out; then
  echo OP3F_LOUD_FAIL_OK
else
  echo OP3F_NO_LOUD_FAIL_FAIL
  echo MU_OP3F_DID_NOT_FAIL_LOUD_review
  rc=1
fi
echo '== observational: flag the mis-worded message (the #8 clarity fix should reword it) =='
if grep -qiE "cannot recommend a bridge gid" /tmp/op3f_setup.out; then
  echo "loud-fail message is the bridge-gid wording, not the missing-subid wording"
  echo OP3F_MESSAGE_MISLEADING_review
fi
exit $rc
'''

[[probe]]
id = "mixed-subid-overlap-and-guard"
title = "F-071 SILENT-OVERLAP RED GATE (separate-user path): run op4's separate-user setup AS a FRESH operator; assert the dedicated `sandbox` user's subid range does NOT overlap op1's, AND keep the existing L2 bridge-gid guard check"
tag = "mutating:host-root"
timeout = 1200
classifies = "The REAL F-071 silent overlap (re-aim, grounded in code + confirmed by smoke). op4 (a fourth real operator, created in the mk-op4 prep step) runs `sandbox setup --docker-execution-mode separate-user --yes`. L2 (_act, l2_host_prereqs.py:343-349) appends the HARDCODED literal 100000-65535 to the freshly-created `sandbox` user (useradd --system grants no subids) with NO cross-user overlap check. PREMISE UPDATED to the SHIPPED allocator: op1 (= the probe user) holds 100000, but the fixed separate-user path now assigns the dedicated `sandbox` user a DISTINCT range (observed sandbox:296608:65536), so a REAL overlap cannot be driven on HEAD. The gate therefore asserts the disjointness PROPERTY the fix guarantees -> distinct = SUBID_SANDBOXUSER_VS_OP1_DISTINCT_OK; a (now-only-synthetic) overlap = SUBID_SANDBOXUSER_VS_OP1_OVERLAP_FAIL (RED) + MU_SUBID_OVERLAP_DETECTED_review. To keep that pass from being VACUOUS, a detector self-test (SUBID_DETECTOR_SELFTEST_OK) feeds overlap() a synthetic overlapping pair + a synthetic disjoint pair and asserts it classifies both correctly, proving the gate can still fire on a regression. op4's setup exit is surfaced first (#8) so a failed precondition cannot hide behind the downstream pass. CRITICAL INVOCATION FIX: op4's separate-user setup runs via `sudo -iu op4 bash /tmp/op4_setup.sh`, whose inner `sudo` is invoked BY op4 -> SUDO_USER=op4, euid=root -> the operator resolves to op4 (a FRESH operator, NOT the already-op-rootless probe user) -> no 'switching to separate-user requires teardown first' mode-switch refusal. This is the ONE place SUDO_USER must remain the op4-set value (separate-user setup REQUIRES SUDO_USER to identify the operator); it is NOT unset here. A SECOND assertion keeps the existing-correct L2 bridge-gid guard check (sb-ws in/out of the sandbox-user range -> MU_L2_GUARD_FIRED_OK / MU_L2_NO_COLLISION_IN_RANGE_OK / MU_L2_GUARD_DID_NOT_FIRE_FAIL / MU_L2_NO_COLLIDING_GROUP_OK), gated as before. op4's setup uses the script-file pattern (no sudo -i newline collapse); op4's pure creation (useradd + uv sync) was hoisted into the mk-op4 prep step."
run = '''
. /tmp/sbai-helpers.sh
rc=0
echo '== record whether a colliding shared sb-ws PRE-EXISTS before op4 separate-user setup =='
# In op-rootless-first there is NO shared sb-ws (op1 created the per-operator sb-ws-<op1>),
# so this is legitimately <none>; the L2 guard then has nothing pre-existing to fire on.
SBWS_GID=$(getent group sb-ws | cut -d: -f3)
echo "shared sb-ws gid before op4 setup: ${SBWS_GID:-<none>} ARCB_review"
echo '== op4 separate-user setup AS A FRESH OPERATOR op4 (inner sudo invoked BY op4 -> SUDO_USER=op4) =='
# script-file pattern: write as probe user, run as op4 with a single path arg (no sudo -i newline collapse).
# The inner `sudo` here is run BY op4, so SUDO_USER=op4 and euid=root -> sandbox resolves the operator as
# op4 (a fresh operator, NOT the already-op-rootless probe user) -> no mode-switch teardown refusal.
# DELIBERATELY do NOT unset SUDO_*: separate-user setup REQUIRES SUDO_USER=op4 to identify the operator.
cat > /tmp/op4_setup.sh <<'SCRIPT'
sudo env PATH="$HOME/sandbox-ai/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" sandbox setup --docker-execution-mode separate-user --docker-unprivileged-user sandbox --yes
SCRIPT
chmod 0755 /tmp/op4_setup.sh
sudo -iu op4 bash /tmp/op4_setup.sh > /tmp/op4_setup.out 2>&1
SRC=$?
echo "op4 separate-user setup exit: $SRC"
tail -30 /tmp/op4_setup.out
echo '== surface op4 separate-user setup exit BEFORE trusting the overlap/guard asserts (#8) =='
# A failed precondition must not hide behind a green downstream PASS. CRITICAL: "Exit sentinel
# not found" is a GENERIC framing-absent error (executor.py:_raise_sentinel_not_found — emitted
# for a sudo refusal, a forged trailer, a manager-not-ready EMPTY machinectl crossing, OR a
# crashed inner command). It does NOT by itself mean the benign F-055 race, so we must NOT wave
# every sentinel failure through. The F-071 disjointness gate below is independently protected
# by its own SUBID_SANDBOXUSER_*_MISSING_FAIL (the subid append precedes L5, so the property is
# still assertable), but op4's SETUP failure itself is classified narrowly here:
if [ "$SRC" -eq 0 ]; then
  echo OP4_SETUP_EXIT0_review
else
  echo "== op4 setup exited $SRC: capture forensics + classify (do NOT auto-wave a sentinel failure) =="
  SBX_UID=$(id -u sandbox 2>/dev/null)
  echo "--- sandbox-user rootless dockerd state (forensic; same fragility class as op2 core-1 exit-126) ---"
  if [ -n "$SBX_UID" ]; then
    sudo -u sandbox env XDG_RUNTIME_DIR="/run/user/$SBX_UID" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$SBX_UID/bus" systemctl --user status docker.service --no-pager 2>&1 | tail -20 | sed 's/^/  dockerd: /'
    sudo -u sandbox env XDG_RUNTIME_DIR="/run/user/$SBX_UID" journalctl --user -u docker.service --no-pager 2>&1 | tail -20 | sed 's/^/  journal: /'
  fi
  # CRITICAL: the non-TTY setup capture LINE-WRAPS at ~80 cols, splitting phrases mid-line
  # (observed: "[FATAL] Exit \nsentinel not found"). A line-anchored grep therefore matches
  # nothing and mis-gates a real F-055 race. Normalize FIRST — collapse newlines + whitespace
  # runs to single spaces — so wrapping can never split the anchor / banner / error markers.
  NORM=$(tr '\n' ' ' < /tmp/op4_setup.out 2>/dev/null | tr -s ' ')
  echo "--- normalized op4 setup tail (forensic) ---"
  printf '%s\n' "$NORM" | tail -c 1400 | sed 's/^/  out: /'
  if printf '%s' "$NORM" | grep -qiE "sentinel not found"; then
    # Scope to the FATAL's Output block on the normalized single line: text AFTER the anchor,
    # trimmed at the setup "Summary:" line — so earlier phases' incidental tokens are excluded.
    REGION=${NORM#*[Ss]entinel not found}
    REGION=${REGION%%Summary:*}
    # NARROW F-055 signature: the machinectl crossing returned ONLY its PTY banner ("Connection
    # to the local host terminated") with NO inner install output (no dockerd-rootless /
    # rootlesskit / newuidmap / install error markers). "docker.service could not be found" is a
    # CONSEQUENCE of the install never running (the race), NOT a crash marker. Any substantive
    # install/error content = a genuine crash → GATE.
    if printf '%s' "$REGION" | grep -qiE "Connection to the local host terminated" \
       && ! printf '%s' "$REGION" | grep -qiE "dockerd-rootless|rootlesskit|newuidmap|newgidmap|No such file|command not found|permission denied|\[ERROR\]|Cannot connect|Job for .* failed"; then
      echo "op4 L5 hit the NARROW F-055 machinectl banner-only empty crossing (known-open apt-family readiness race), NOT a crash"
      echo OP4_SETUP_F055_EMPTY_CROSSING_review
    else
      echo "op4 setup sentinel failure with substantive error output (genuine crash / install failure) -- GATED, not waved"
      echo OP4_SETUP_FAILED_FAIL
      rc=1
    fi
  else
    echo "op4 setup failed without a sentinel-framing error (non-race failure) -- GATED"
    echo OP4_SETUP_FAILED_FAIL
    rc=1
  fi
fi
echo '== F-071 SILENT-OVERLAP GATE: sandbox-user subid range vs op1 (the probe operator) =='
SB_SUBUID=$(grep -E "^sandbox:" /etc/subuid 2>/dev/null | head -1)
SB_SUBGID=$(grep -E "^sandbox:" /etc/subgid 2>/dev/null | head -1)
OP1_SUBUID=$(head -1 /tmp/op1.subuid 2>/dev/null)
OP1_SUBGID=$(head -1 /tmp/op1.subgid 2>/dev/null)
# Fallback: if op1-setup did not persist the range files, read probe (op1) directly.
OP1_NAME=$(id -un)
[ -n "$OP1_SUBUID" ] || OP1_SUBUID=$(grep -E "^${OP1_NAME}:" /etc/subuid 2>/dev/null | head -1)
[ -n "$OP1_SUBGID" ] || OP1_SUBGID=$(grep -E "^${OP1_NAME}:" /etc/subgid 2>/dev/null | head -1)
echo "SANDBOX_SUBUID=${SB_SUBUID:-<none>} SUBID_review"
echo "OP1_SUBUID=${OP1_SUBUID:-<none>} SUBID_review"
echo "SANDBOX_SUBGID=${SB_SUBGID:-<none>} SUBID_review"
echo "OP1_SUBGID=${OP1_SUBGID:-<none>} SUBID_review"
overlap() {
  line_a=$1
  line_b=$2
  s1=$(printf '%s' "$line_a" | cut -d: -f2)
  c1=$(printf '%s' "$line_a" | cut -d: -f3)
  s2=$(printf '%s' "$line_b" | cut -d: -f2)
  c2=$(printf '%s' "$line_b" | cut -d: -f3)
  case "$s1$c1$s2$c2" in
    *[!0-9]*|'') echo unknown; return ;;
  esac
  e1=$((s1 + c1))
  e2=$((s2 + c2))
  if [ "$s1" -lt "$e2" ] && [ "$s2" -lt "$e1" ]; then echo yes; else echo no; fi
}
echo '== detector self-test: prove overlap() distinguishes overlap from disjoint (non-vacuity, #8) =='
# The shipped allocator now hands the dedicated sandbox user a DISTINCT range (e.g.
# sandbox:296608), so a REAL overlap cannot be driven on HEAD — the OVERLAP_FAIL branch
# would otherwise never execute and the DISTINCT_OK pass would be vacuous. This self-test
# feeds the detector a SYNTHETIC overlapping pair and a synthetic disjoint pair and asserts
# it classifies both correctly, so a green F-071 verdict proves the gate can actually fire.
ST_OVL=$(overlap "x:100000:65536" "y:100000:65536")
ST_DIS=$(overlap "x:100000:65536" "y:296608:65536")
echo "self-test: overlapping->$ST_OVL  disjoint->$ST_DIS"
if [ "$ST_OVL" = yes ] && [ "$ST_DIS" = no ]; then echo SUBID_DETECTOR_SELFTEST_OK; else echo SUBID_DETECTOR_SELFTEST_FAIL; rc=1; fi
echo '== subuid overlap (sandbox user vs op1) =='
if [ -z "$SB_SUBUID" ] || [ -z "$OP1_SUBUID" ]; then
  echo SUBID_SANDBOXUSER_SUBUID_MISSING_FAIL; rc=1
else
  OV=$(overlap "$SB_SUBUID" "$OP1_SUBUID")
  echo "subuid overlap verdict: $OV"
  case "$OV" in
    no) echo SUBID_SANDBOXUSER_VS_OP1_SUBUID_DISTINCT_OK ;;
    yes) echo SUBID_SANDBOXUSER_VS_OP1_SUBUID_OVERLAP_FAIL; echo MU_SUBID_OVERLAP_DETECTED_review; rc=1 ;;
    *) echo SUBID_SANDBOXUSER_SUBUID_UNPARSEABLE_FAIL; rc=1 ;;
  esac
fi
echo '== subgid overlap (sandbox user vs op1) =='
if [ -z "$SB_SUBGID" ] || [ -z "$OP1_SUBGID" ]; then
  echo SUBID_SANDBOXUSER_SUBGID_MISSING_FAIL; rc=1
else
  OV=$(overlap "$SB_SUBGID" "$OP1_SUBGID")
  echo "subgid overlap verdict: $OV"
  case "$OV" in
    no) echo SUBID_SANDBOXUSER_VS_OP1_SUBGID_DISTINCT_OK ;;
    yes) echo SUBID_SANDBOXUSER_VS_OP1_SUBGID_OVERLAP_FAIL; echo MU_SUBID_OVERLAP_DETECTED_review; rc=1 ;;
    *) echo SUBID_SANDBOXUSER_SUBGID_UNPARSEABLE_FAIL; rc=1 ;;
  esac
fi
echo '== SECOND assertion: the existing-correct L2 bridge-gid guard (sb-ws in/out of sandbox-user range) =='
# The L2 guard (l2_host_prereqs.py:357-365) SHOULD fire iff the pre-existing sb-ws gid is OUTSIDE
# the dedicated sandbox user range. If the sandbox user got the same default 100000 block, sb-ws
# (from op1's op-rootless setup) lands IN range and a silent no-fire is CORRECT, not a bug. Judge on
# the real condition, not an unconditional "must fire".
echo "sandbox user subgid: ${SB_SUBGID:-<none>} ARCB_review"
GUARD_MSG=0
if grep -qiE "outside .*/etc/subgid range|will not move an operator-created group|outside .* subgid range" /tmp/op4_setup.out; then GUARD_MSG=1; fi
IN_RANGE=unknown
if [ -n "$SBWS_GID" ] && [ -n "$SB_SUBGID" ]; then
  SS=$(printf '%s' "$SB_SUBGID" | cut -d: -f2)
  SC=$(printf '%s' "$SB_SUBGID" | cut -d: -f3)
  case "$SBWS_GID$SS$SC" in
    *[!0-9]*|'') IN_RANGE=unknown ;;
    *) SE=$((SS + SC)); if [ "$SBWS_GID" -ge "$SS" ] && [ "$SBWS_GID" -lt "$SE" ]; then IN_RANGE=yes; else IN_RANGE=no; fi ;;
  esac
fi
echo "sb-ws in sandbox-user range? $IN_RANGE  (guard message seen: $GUARD_MSG, op4 setup exit: $SRC)"
if [ -z "$SBWS_GID" ]; then
  # HONEST: in op-rootless-first there is no PRE-EXISTING shared sb-ws for the L2 guard to
  # fire on (op1 created the per-operator sb-ws-<op1>). The guard is genuinely NOT exercised
  # in this arc — record that rather than a hollow _OK that proves nothing (overriding rule).
  echo MU_L2_GUARD_NOT_EXERCISED_review
elif [ "$IN_RANGE" = no ]; then
  # sb-ws is genuinely out of the sandbox user range -> the guard MUST fire loudly.
  if [ "$SRC" -ne 0 ] && [ "$GUARD_MSG" -eq 1 ]; then echo MU_L2_GUARD_FIRED_OK; else echo MU_L2_GUARD_DID_NOT_FIRE_FAIL; rc=1; fi
elif [ "$IN_RANGE" = yes ]; then
  # sb-ws is in range -> no collision -> a silent (non-firing) success is CORRECT.
  echo MU_L2_NO_COLLISION_IN_RANGE_OK
else
  echo MU_L2_RANGE_INDETERMINATE_FAIL; rc=1
fi
exit $rc
'''

[[probe]]
id = "teardown"
title = "best-effort teardown: stop/destroy op2 instance, remove op2/op3f/op4 artifacts"
tag = "mutating:host-root"
timeout = 600
classifies = "Best-effort cleanup so a re-run starts clean: stop/destroy op2's `mu2` instance, remove op2/op3f/op4 sudoers drop-ins, disable linger. Non-gating except that the probe itself must not error out; leftovers are recorded as _review."
run = '''
. /tmp/sbai-helpers.sh
rc=0
echo '== capture-before-destroy guard: if any gated probe failed a container, dump it and PRESERVE the host (#2) =='
if ! sbai_teardown_guard; then
  echo "== forensics captured above; SKIPPING destroy + disable-linger so the orchestrator can inspect the live host =="
  echo TEARDOWN_SKIPPED_FORENSICS_PENDING_review
  exit 0
fi
echo '== no gated container failed: normal best-effort teardown =='
echo '== stop + destroy op2 mu2 instance (best-effort; script-file pattern) =='
cat > /tmp/op2_teardown.sh <<'SCRIPT'
export XDG_RUNTIME_DIR="/run/user/$(id -u)"
export DOCKER_HOST="unix://${XDG_RUNTIME_DIR}/docker.sock"
# unset SUDO_* so `sandbox` resolves the operator as the CURRENT user (op2/op3f), not the
# probe user that `sudo -iu` records in SUDO_USER (l0_identity precedence: --operator -> $SUDO_USER
# -> current). This RESTORES fidelity to the real scenario (opN logs in directly, no SUDO_USER).
unset SUDO_USER SUDO_UID SUDO_GID PKEXEC_UID
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
sandbox stop mu2 2>&1 | tail -3 || true
sandbox destroy mu2 --force --backup-workspaces=none 2>&1 | tail -3 || true
SCRIPT
chmod 0755 /tmp/op2_teardown.sh
sudo -iu op2 bash /tmp/op2_teardown.sh > /tmp/op2_teardown.out 2>&1 || true
tail -10 /tmp/op2_teardown.out
echo '== remove the extra operators sudoers drop-ins + disable linger (best-effort) =='
sudo rm -f /etc/sudoers.d/op2-sandbox /etc/sudoers.d/op3f-sandbox /etc/sudoers.d/op4-sandbox 2>/dev/null || true
sudo loginctl disable-linger op2 2>/dev/null || true
sudo loginctl disable-linger op3f 2>/dev/null || true
sudo loginctl disable-linger op4 2>/dev/null || true
echo TEARDOWN_DROPINS_REMOVED_review
echo '== record leftover op2 containers (non-gating) =='
OP2_UID=$(id -u op2 2>/dev/null)
if [ -n "$OP2_UID" ]; then
  LC=$(sudo -u op2 env XDG_RUNTIME_DIR="/run/user/${OP2_UID}" DOCKER_HOST="unix:///run/user/${OP2_UID}/docker.sock" docker ps -a --format '{{.Names}}' 2>/dev/null | grep -c -- '-mu2-' || true)
  echo "leftover_op2_containers=${LC:-0}"
fi
echo TEARDOWN_DONE_review
exit $rc
'''
