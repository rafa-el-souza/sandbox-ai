[[probe]]
id = "start"
title = "`sandbox start smoke --no-handover` (separate-user): core running under the `sandbox` daemon (verify via machinectl)"
tag = "mutating:host-root"
timeout = 300
classifies = "`sandbox start smoke --no-handover` -> exit 0; no crossing error; the `-smoke-core-1` container is running under the `sandbox` daemon (verified by crossing into the sandbox user via machinectl). Leaves the instance running."
run = '''
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
echo '== start (crosses to the sandbox user via the dispatcher; no interactive handover) =='
sandbox start smoke --no-handover > /tmp/start.out 2>&1
SRC=$?
echo "start exit: $SRC"
tail -30 /tmp/start.out
[ "$SRC" -eq 0 ] && echo START_EXIT0_OK || { echo START_EXIT_NONZERO_FAIL; rc=1; }

echo '== crossing-error guard =='
if grep -qiE "Interactive authentication required|Exit sentinel not found|systemd error|failed to create task" /tmp/start.out; then echo START_CROSSING_ERROR_PRESENT_FAIL; rc=1; else echo START_NO_CROSSING_ERROR_OK; fi

echo '== core-up via the product OWN --wait verdict (no interactive crossing) =='
if grep -qiE 'containers healthy' /tmp/start.out; then echo START_COMPOSE_HEALTHY_OK; else echo START_COMPOSE_HEALTHY_FAIL; rc=1; fi

echo '== crossing mechanism (non-gating) =='
sudo journalctl --since '-120s' --no-pager 2>/dev/null | grep -iE "machinectl|systemd-run|transient" | tail -15
grep -qiE "machinectl shell" /tmp/start.out 2>/dev/null && echo CROSSING_MECH_MACHINECTL_review || true
grep -qiE "systemd-run|--pipe|transient unit" /tmp/start.out 2>/dev/null && echo CROSSING_MECH_PIPE_review || true

echo '== F-063 crossing diagnostic (non-gating) =='
sudo loginctl list-sessions --no-legend 2>/dev/null | tr -s ' ' | sed -n '1,20p'
sudo loginctl user-status sandbox 2>/dev/null | head -20
sudo journalctl -u systemd-logind --since '-120s' --no-pager 2>/dev/null | grep -iE "New session|class|logged out|Removed session" | tail -25
if sudo journalctl -u systemd-logind --since '-120s' --no-pager 2>/dev/null | grep -qiE "user-light"; then
  echo CROSSING_CLASS_USER_LIGHT_review
elif sudo journalctl -u systemd-logind --since '-120s' --no-pager 2>/dev/null | grep -qiE "user-early"; then
  echo CROSSING_CLASS_USER_EARLY_review
else
  echo CROSSING_CLASS_UNKNOWN_review
fi
exit $rc
'''

[[probe]]
id = "core-running"
title = "core container is running, read via the non-PTY sudo -u crossing (reliable in/out of session)"
tag = "mutating:host-root"
timeout = 120
classifies = "After `start`, assert `-smoke-core-1` is in `docker ps` read as the sandbox user via a NON-PTY `sudo -u <user> env XDG_RUNTIME_DIR DOCKER_HOST docker ps` crossing (NOT `machinectl shell`, whose PTY crossing returns empty in-session on apt — F-018/F-055/F-097). Short poll for robustness; stderr kept. Gate CORE_RUNNING_OK — the cell that demonstrates the stack is up."
run = '''
rc=0
echo '== authoritative core-running via the non-PTY sudo -u crossing =='
SBUID=$(id -u sandbox 2>/dev/null)
FOUND=0
CT=''
for i in $(seq 1 10); do
  CT=$(sudo -u sandbox env XDG_RUNTIME_DIR=/run/user/$SBUID DOCKER_HOST=unix:///run/user/$SBUID/docker.sock docker ps --format "{{.Names}} {{.Status}}" 2>&1 | tr -d '\r')
  if echo "$CT" | grep -q -- '-smoke-core-1'; then FOUND=1; echo "core visible on attempt $i"; break; fi
  sleep 2
done
echo "containers: $CT"
if [ "$FOUND" -eq 1 ]; then echo CORE_RUNNING_OK; else echo CORE_RUNNING_FAIL; rc=1; fi
exit $rc
'''

[[probe]]
id = "preflight-crossing-count"
title = "start's read-only preflight is exactly TWO crossings (preflight + compose-ps), not ~8"
tag = "mutating:host-root"
timeout = 180
classifies = "C-009 D6 burst-collapse acceptance (faithful, real-host): re-runs `sandbox start smoke --no-handover` on the already-running instance so only the read-only preflight crossings fire (the warm-check returns 'already running' before any compose-up/helper crossing), then counts the dispatcher's structured journald op audit (SANDBOX_AI_OP=<op>) in that window. Gate: exactly one `preflight` op + one `compose-ps` op, and ZERO of the old per-check ops (auth-probe/docker-version/docker-info/compose-ls) as separate crossings."
run = '''
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
echo "== record a journald window, then re-run start (warm path) =="
sleep 1
T=$(date "+%Y-%m-%d %H:%M:%S")
sleep 1
sandbox start smoke --no-handover > /tmp/recount.out 2>&1
SRC=$?
echo "re-run exit: $SRC"
tail -6 /tmp/recount.out
grep -qi "already running" /tmp/recount.out && echo CC_WARM_PATH_OK || echo CC_WARM_PATH_review

echo "== count read-only dispatch ops since T via SANDBOX_AI_OP =="
NPRE=$(sudo journalctl --since "$T" SANDBOX_AI_OP=preflight --no-pager 2>/dev/null | grep -c "dispatch preflight")
NPS=$(sudo journalctl --since "$T" SANDBOX_AI_OP=compose-ps --no-pager 2>/dev/null | grep -c "dispatch compose-ps")
echo "preflight ops=$NPRE  compose-ps ops=$NPS"

echo "== old per-check ops must NOT appear as SEPARATE crossings (bundled into preflight) =="
NOLD=0
for op in auth-probe docker-version docker-info compose-ls; do
  c=$(sudo journalctl --since "$T" SANDBOX_AI_OP=$op --no-pager 2>/dev/null | grep -c "dispatch $op")
  echo "  $op separate crossings: $c"
  NOLD=$((NOLD+c))
done
echo "old per-check separate crossings total: $NOLD"
if [ "$NPRE" -eq 1 ] && [ "$NPS" -eq 1 ] && [ "$NOLD" -eq 0 ]; then echo CC_TWO_CROSSINGS_OK; else echo CC_NOT_TWO_CROSSINGS_FAIL; rc=1; fi

echo "== diagnostic: all SANDBOX_AI_OP entries in the window (non-gating) =="
sudo journalctl --since "$T" --no-pager 2>/dev/null | grep -oE "dispatch [a-z-]+" | sort | uniq -c
echo CC_OP_HISTOGRAM_review
exit $rc
'''

