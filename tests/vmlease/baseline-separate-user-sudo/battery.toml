[[probe]]
id = "attach"
title = "C-010 F-060 fix: NON-INTERACTIVE command-mode attach over the product's own `sudo systemd-run --pipe … dispatch fwd <wire>` ProxyCommand -> headless success"
tag = "mutating:host-root"
timeout = 180
classifies = "C-010 acceptance (flips the F-060 RED baseline attach FAIL x4 to PASS): obtains the REAL ProxyCommand from the product surface (`core.dispatch.proxy_argv(Op.FWD, ['smoke'], host_config)` — the single sanctioned `dispatch fwd <wire>` producer, NOT a hand-typed mirror — F-019), so the crossing exercises the genuine `sudo systemd-run --pipe … dispatch fwd <wire>` argv against the real per-op sudoers Cmnd_Spec. ssh runs in command mode (`-T`, no PTY, no tlog-rec) with the per-instance key/known_hosts + the hardened client options the product pins, executing a remote `whoami` sentinel instead of the interactive `bash -l`. Gate ATTACH_FWD_HEADLESS_OK: the `__ATTACH_OK_agent_0__` sentinel returns -> sudo authorized the fwd crossing headlessly, the dispatcher streamed, the admin /fwd reached core sshd, auth + exec succeeded."
run = '''
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
SBROOT="$HOME/sandbox-ai"
SECRETS="$HOME/.sandbox-ai/instances/smoke/secrets"
echo '== precondition: core up (read via the reliable non-PTY sudo -u crossing) =='
SBUID=$(id -u sandbox 2>/dev/null)
CT=$(sudo -u sandbox env XDG_RUNTIME_DIR=/run/user/$SBUID DOCKER_HOST=unix:///run/user/$SBUID/docker.sock docker ps --format "{{.Names}}" 2>&1 | tr -d '\r')
echo "$CT" | grep -q -- '-smoke-admin-1' && echo ATTACH_PRECOND_ADMIN_RUNNING_OK || { echo ATTACH_PRECOND_ADMIN_NOT_RUNNING_FAIL; rc=1; }

echo '== obtain the REAL ProxyCommand from the product surface (proxy_argv, NOT hand-typed) =='
PROXY=$(PYTHONPATH="$SBROOT/src" "$SBROOT/.venv/bin/python3" -c "import shlex; from core.dispatch import proxy_argv, Op; from core.host_config import minimal_host_config, MachinectlAuth; hc = minimal_host_config('sandbox', MachinectlAuth.SUDO); print(shlex.join(proxy_argv(Op.FWD, ['smoke'], hc)))" 2>/tmp/proxy_build.err)
if [ -z "$PROXY" ]; then echo "--- proxy build err ---"; tail -8 /tmp/proxy_build.err; echo ATTACH_PROXY_BUILD_FAIL; rc=1; echo "$rc" >/dev/null; exit $rc; fi
echo "PROXY=$PROXY"
echo "$PROXY" | grep -q 'dispatch fwd' && echo ATTACH_PROXY_IS_DISPATCH_FWD_OK || { echo ATTACH_PROXY_NOT_DISPATCH_FWD_FAIL; rc=1; }
echo "$PROXY" | grep -q 'sudo' && echo ATTACH_PROXY_SUDO_PIPE_OK || { echo ATTACH_PROXY_NOT_SUDO_PIPE_FAIL; rc=1; }

echo '== resolve the core IPC IP via the SAME product resolver attach uses =='
IP=$(PYTHONPATH="$SBROOT/src" "$SBROOT/.venv/bin/python3" -c 'from core.dispatch import resolve_fwd_state; print(resolve_fwd_state("smoke")[1])' 2>/tmp/ip_build.err)
echo "CORE_IPC_IP=$IP"
[ -n "$IP" ] && echo ATTACH_IP_RESOLVED_OK || { echo ATTACH_IP_RESOLVE_FAIL; rc=1; }

echo '== non-interactive command-mode attach: ssh (-T, no PTY) runs a remote sentinel =='
echo '== client opts mirror the product pins; ProxyCommand is the product argv above =='
SRAW=$(ssh -T -F /dev/null -i "$SECRETS/ipc_ssh_key" -o UserKnownHostsFile="$SECRETS/ipc_known_hosts" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no -o ForwardX11=no -o ClearAllForwardings=yes -o PermitLocalCommand=no -o ProxyCommand="$PROXY" -p 9999 "agent@$IP" 'echo __ATTACH_OK_$(whoami)_$?__' 2>/tmp/attach_ssh.err)
SEX=$?
echo "ssh exit: $SEX"
echo "--- ssh remote output ---"
printf "%s\n" "$SRAW"
echo "--- ssh stderr (tail) ---"
tail -12 /tmp/attach_ssh.err 2>/dev/null
echo '== PRIMARY: the remote sentinel came back -> the whole fwd chain authorized + streamed =='
if [ "$SEX" -eq 0 ] && printf "%s" "$SRAW" | grep -q "__ATTACH_OK_agent_0__"; then echo ATTACH_FWD_HEADLESS_OK; else echo ATTACH_FWD_HEADLESS_FAIL; rc=1; fi
exit $rc
'''

[[probe]]
id = "stop"
title = "`sandbox stop smoke`: no smoke container after settle (verify via machinectl)"
tag = "mutating:host-root"
classifies = "`sandbox stop smoke` -> exit 0 + no running `-smoke-` container under the sandbox daemon after a ~30s settle/retry loop."
run = '''
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
sandbox stop smoke > /tmp/stop.out 2>&1
STC=$?
echo "stop exit: $STC"
tail -15 /tmp/stop.out
[ "$STC" -eq 0 ] && echo STOP_EXIT0_OK || { echo STOP_EXIT_NONZERO_FAIL; rc=1; }
echo '== assert no smoke container after stop (settle/retry up to ~30s: arch teardown lags) =='
GONE=0
for i in $(seq 1 15); do
  CT=$(sudo machinectl shell -q sandbox@.host /bin/bash -lc 'export DOCKER_HOST=unix:///run/user/$(id -u)/docker.sock; docker ps --format "{{.Names}}" 2>/dev/null' 2>/dev/null | tr -d '\r')
  if echo "$CT" | grep -q -- '-smoke-'; then sleep 2; else GONE=1; break; fi
done
if [ "$GONE" -eq 1 ]; then echo STOP_NO_CONTAINER_OK; else echo STOP_CONTAINER_STILL_RUNNING_FAIL; rc=1; fi
exit $rc
'''

[[probe]]
id = "ws-remove"
title = "`sandbox workspace remove smoke dev2 --backup`"
tag = "mutating:host-root"
classifies = "`sandbox workspace remove smoke dev2 --backup` -> exit 0 + `dev2` gone from the ACTIVE workspaces (checked via --no-backups so the backup id containing 'dev2' does not false-positive; instance stopped; leaves a backup for restore)."
run = '''
export PATH="$HOME/sandbox-ai/.venv/bin:$PATH"
rc=0
sandbox workspace remove smoke dev2 --backup > /tmp/wsremove.out 2>&1
WRC=$?
echo "ws-remove exit: $WRC"
tail -20 /tmp/wsremove.out
[ "$WRC" -eq 0 ] && echo WS_REMOVE_EXIT0_OK || { echo WS_REMOVE_EXIT_NONZERO_FAIL; rc=1; }
sandbox workspace list smoke --no-backups --json > /tmp/wsremove_list.out 2>&1
if "$HOME/sandbox-ai/.venv/bin/python3" -c "import json,sys; d=json.load(open('/tmp/wsremove_list.out')); names=[w['name'] for w in d.get('workspaces',[])]; sys.exit(0 if 'dev2' not in names else 1)"; then echo WS_REMOVE_DEV2_GONE_OK; else echo WS_REMOVE_DEV2_REMAINS_FAIL; rc=1; cat /tmp/wsremove_list.out; fi
exit $rc
'''

