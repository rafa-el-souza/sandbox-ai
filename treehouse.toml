# max_trees is THIS REPO's crewmate concurrency ceiling, and the pool is the
# only structural limit on them: the firstmate has no dispatch cap of its own.
# The setting is per repo and each repo's pool is independent, so the fleet
# total is the SUM of every repo's max_trees, not this number - this repo can
# neither see nor enforce what the others set.
# The per-repo scope is the design accepted on 2026-07-21; an earlier version of
# this comment called 4 the "fleet-wide concurrency ceiling", which the
# mechanism never implemented.
max_trees = 4

# Worktree root directory (relative to repo root or absolute path).
# Worktrees are placed under {root}/.treehouse/. Default: $HOME
root = ""
