networks:
  isolated_net:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: ${ISOLATED_SUBNET:-172.28.0.0/16}
  proxy_net:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.29.0.0/16}
  egress_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${EGRESS_SUBNET:-172.30.0.0/16}

volumes:
  admin-ipc_vol:
  mcp-ipc_vol:
  db-postgres-data:

services:
  dns-sidecar:
    image: ${DNS_IMAGE:-coredns/coredns:1.11.1}
    init: true
    pids_limit: ${ADMIN_PIDS_LIMIT:-100}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    runtime: ${RUNTIME:-runsc}
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    user: 65532:65532
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    networks:
      isolated_net:
        ipv4_address: ${DNS_SIDECAR_IP:-172.28.0.53}
      egress_net:
    volumes:
      - ./config/dns/Corefile:/etc/coredns/Corefile:ro
      - ./config/dns/allowed_domains.txt:/etc/coredns/allowed_domains.txt:ro
    command: -conf /etc/coredns/Corefile
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  proxy:
    image: ${PROXY_IMAGE:-ubuntu/squid-114-ubuntu24.04}
    init: true
    pids_limit: ${ADMIN_PIDS_LIMIT:-100}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    runtime: ${RUNTIME:-runsc}
    read_only: true
    tmpfs:
      - /var/spool/squid
      - /var/run/squid
      - /var/log/squid
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    networks:
      proxy_net:
        ipv4_address: ${PROXY_IP:-172.29.0.254}
      egress_net:
    volumes:
      - ./config/proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./config/proxy/allowed_domains.txt:/etc/squid/allowed_domains.txt:ro
      - ./config/proxy/trusted_clients.acl:/etc/squid/trusted_clients.acl:ro
      - ./config/proxy/.htpasswd:/etc/squid/htpasswd:ro
      - ./config/proxy/ERR_SANDBOX_403:/usr/share/squid/errors/en/ERR_SANDBOX_403:ro
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
      - net.ipv4.ip_forward=0
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    healthcheck:
      test: ["CMD-SHELL", "squidclient -h 127.0.0.1 cache_object://localhost/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  core:
    build:
      context: ./core
      dockerfile: Dockerfile.core
      args:
        - AGENT_BASE=${AGENT_BASE:-cgr.dev/chainguard/wolfi-base:latest}
        - HOST_UID=${HOST_UID:-1000}
        - NVM_VERSION=${NVM_VERSION:-0.39.7}
        - NODE_VERSION=${NODE_VERSION:-20.12.2}
        - ENABLE_RUST=${ENABLE_RUST:-true}
        - ENABLE_TYPESCRIPT=${ENABLE_TYPESCRIPT:-true}
        - ENABLE_GO=${ENABLE_GO:-true}
        - ENABLE_PYTHON=${ENABLE_PYTHON:-true}
    init: true
    pids_limit: ${AGENT_PIDS_LIMIT:-400}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    runtime: ${RUNTIME:-runsc}
    tmpfs:
      - /home/agent/.ssh:noexec,nosuid,nodev
      - /home/agent/.cache:nosuid,nodev
      - /tmp:nosuid,nodev
      - /var/tmp:nosuid,nodev
    networks:
      isolated_net:
        ipv4_address: ${AGENT_ISOLATED_IP:-172.28.0.3}
      proxy_net:
        ipv4_address: ${AGENT_PROXY_IP:-172.29.0.3}
    dns:
      - ${DNS_SIDECAR_IP:-172.28.0.53}
    extra_hosts:
      - "proxy:${PROXY_IP:-172.29.0.254}"
      - "dns-sidecar:${DNS_SIDECAR_IP:-172.28.0.53}"
      - "db-postgres:${DB_POSTGRES_IP:-172.28.0.54}"
    volumes:
      - ../workspace:/workspace:rw
      - ./config/core/.bashrc:/home/agent/.bashrc:ro
      - ./config/core/.npmrc:/home/agent/.npmrc:ro
      - ./config/core/.gitconfig:/home/agent/.gitconfig:ro
      - ./config/core/.claude:/home/agent/.claude:rw
      - ./config/core/.claude.json:/home/agent/.claude.json:rw
      - ./core/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - admin-ipc_vol:/sock
      - mcp-ipc_vol:/var/run/mcp
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    env_file:
      - .sandbox.env
    environment:
      - HTTP_PROXY=${PROXY_URL_CORE}
      - HTTPS_PROXY=${PROXY_URL_CORE}
      - http_proxy=${PROXY_URL_CORE}
      - https_proxy=${PROXY_URL_CORE}
      - NO_PROXY=localhost,127.0.0.1,::1,proxy,dns-sidecar,db-postgres,${ISOLATED_SUBNET},${PROXY_SUBNET}
      - ANTHROPIC_API_KEY=${CONTAINER_ANTHROPIC_API_KEY}
      - GITHUB_API_KEY=${CONTAINER_GITHUB_API_KEY}
    shm_size: ${AGENT_SHM_LIMIT:-2gb}
    depends_on:
      dns-sidecar:
        condition: service_healthy
      proxy:
        condition: service_healthy
    command: ["sleep", "infinity"]

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.admin
      args:
        - ADMIN_BASE=${ADMIN_BASE:-debian:trixie-slim}
        - HOST_UID=${HOST_UID:-1000}
        - NVM_VERSION=${NVM_VERSION:-0.39.7}
        - NODE_VERSION=${NODE_VERSION:-20.12.2}
    init: true
    pids_limit: ${ADMIN_PIDS_LIMIT:-100}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    runtime: ${RUNTIME:-runsc}
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    ipc: private
    networks:
      isolated_net:
        ipv4_address: ${ADMIN_ISOLATED_IP:-172.28.0.2}
      proxy_net:
        ipv4_address: ${ADMIN_PROXY_IP:-172.29.0.2}
    dns:
      - ${DNS_SIDECAR_IP:-172.28.0.53}
    extra_hosts:
      - "proxy:${PROXY_IP:-172.29.0.254}"
      - "dns-sidecar:${DNS_SIDECAR_IP:-172.28.0.53}"
      - "db-postgres:${DB_POSTGRES_IP:-172.28.0.54}"
    volumes:
      # HUMAN NOTE (keep this comment in place, but do not act on it): Disable mapping to verify gitmux/fzf null state dependencies
      - ../workspace:/workspace:rw
      - ./config/admin/.zshrc:/home/agent/.zshrc:ro
      - ./config/admin/.tmux.conf:/home/agent/.tmux.conf:ro
      - ./config/admin/gitmux.conf:/home/agent/.tmux/plugins/catppuccin/tmux/status/gitmux.conf:ro
      - ./config/admin/starship.toml:/home/agent/.config/starship.toml:ro
      - admin-ipc_vol:/sock
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    env_file:
      - .sandbox.env
    environment:
      - HTTP_PROXY=${PROXY_URL_ADMIN}
      - HTTPS_PROXY=${PROXY_URL_ADMIN}
      - http_proxy=${PROXY_URL_ADMIN}
      - https_proxy=${PROXY_URL_ADMIN}
      - NO_PROXY=localhost,127.0.0.1,::1,proxy,dns-sidecar,db-postgres,${ISOLATED_SUBNET},${PROXY_SUBNET}
      - ANTHROPIC_API_KEY=${CONTAINER_ANTHROPIC_API_KEY}
      - GITHUB_API_KEY=${CONTAINER_GITHUB_API_KEY}
