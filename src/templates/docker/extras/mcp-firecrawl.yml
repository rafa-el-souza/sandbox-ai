services:
  mcp-firecrawl:
    build:
      context: ..
      dockerfile: extra/Dockerfile.mcp-firecrawl
    image: sandbox-mcp-firecrawl:local
    init: true
    pids_limit: {{ core_pids_limit }}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    runtime: {{ runtime }}
    user: node
    read_only: true
    tmpfs:
      - /home/node/.cache:nosuid,nodev
      - /home/node/.ssh:noexec,nosuid,nodev
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    networks:
      core_proxy_net:
        ipv4_address: {{ mcp_firecrawl_proxy_ip }}
      dns_net:
        ipv4_address: {{ firecrawl_dns_ip }}
      isolated_net:
        ipv4_address: {{ firecrawl_isolated_ip }}
    dns:
      - {{ dnsdist_dns_ip }}
    extra_hosts:
      - "proxy:{{ proxy_core_ip }}"
      - "coredns:{{ coredns_dns_ip }}"
      - "dnsdist:{{ dnsdist_dns_ip }}"
      - "db-postgres:{{ db_postgres_ip }}"
    env_file:
      - "{{ instance_dir }}/.sandbox.env"
    environment:
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - HTTP_PROXY=http://proxyuser:{{ proxy_password }}@proxy:3128
      - HTTPS_PROXY=http://proxyuser:{{ proxy_password }}@proxy:3128
      - http_proxy=http://proxyuser:{{ proxy_password }}@proxy:3128
      - https_proxy=http://proxyuser:{{ proxy_password }}@proxy:3128
      - NO_PROXY=localhost,127.0.0.1,::1,proxy,coredns,dnsdist,db-postgres,{{ core_proxy_subnet }},{{ dns_subnet }}
    entrypoint: ["npx", "-y", "mcp-proxy", "--port", "3000", "--server", "stream", "--", "npx", "-y", "firecrawl-mcp"]
    depends_on:
      dnsdist:
        condition: service_healthy
      proxy:
        condition: service_healthy