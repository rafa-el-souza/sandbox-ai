# ─── Shared Security Baseline ─────────────────────────────────────────────────
# YAML anchor merge (<<:) replaces list values — only scalar properties here.
# List-valued properties (cap_add, sysctls, tmpfs) remain per-service (D4).
x-security-baseline: &security-baseline
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ipc: private
  init: true
  read_only: true

networks:
  isolated_net:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: "{{ isolated_subnet }}"
  core_proxy_net:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: "{{ core_proxy_subnet }}"
  dns_net:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: "{{ dns_subnet }}"
  egress_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: "{{ egress_subnet }}"
  ipc_net:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: "{{ ipc_subnet }}"

services:
  coredns:
    <<: *security-baseline
    build:
      context: "{{ instance_dir }}/docker/coredns"
      dockerfile: Dockerfile.coredns
      args:
        - "CORE_BASE={{ dns_image }}"
        - "BUSYBOX_BASE={{ busybox_image }}"
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    cap_add:
      - NET_BIND_SERVICE
    runtime: "{{ runtime }}"
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    user: 65532:65532
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
      - net.ipv4.ip_forward=0
    networks:
      dns_net:
        ipv4_address: "{{ coredns_dns_ip }}"
      egress_net:
        ipv4_address: "{{ coredns_egress_ip }}"
    volumes:
      - "{{ instance_dir }}/config/coredns/Corefile:/etc/coredns/Corefile:ro"
    command: -conf /etc/coredns/Corefile
    healthcheck:
      test: ["CMD", "/wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  dnsdist:
    <<: *security-baseline
    # dnsdist under operator-rootless gVisor: opt this container out of the OCI
    # seccomp profile. Under gVisor with --oci-seccomp, dnsdist aborts at startup
    # ('Fatal error: Operation not permitted') — gVisor denies clone3 (syscall 435,
    # "denied by seccomp") because it does NOT honor the profile's errnoRet=ENOSYS
    # that Docker's default policy uses for clone3 (moby#42681 / runtime-spec#1087),
    # so glibc's clone3->clone fallback (which fires on ENOSYS, not EPERM) never
    # triggers. dnsdist is the one sidecar that aborts on it; coredns/proxy tolerate
    # their own seccomp EPERMs. seccomp:unconfined here is NOT a meaningful
    # reduction: under gVisor the container OCI profile is a redundant inner layer
    # — the Sentry intercepts every guest syscall in userspace, and gVisor's own
    # seccomp (which guards the Sentry->host boundary, always on) is the real
    # filter. Vendoring Docker's ~900-line default profile to preserve the inner
    # layer was rejected as disproportionate (drift-prone maintenance for a
    # redundant layer) — and it might not even work, since gVisor ignores errnoRet.
    # Overrides the anchor's security_opt, so no-new-privileges is re-stated.
    security_opt:
      - "no-new-privileges:true"
      - "seccomp:unconfined"
    image: "{{ dnsdist_image }}"
    cap_add:
      - NET_BIND_SERVICE
    user: "pdns:pdns"
    runtime: "{{ runtime }}"
    pids_limit: 100
    mem_limit: "512m"
    memswap_limit: "512m"
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    sysctls:
      - net.ipv4.ip_forward=0
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    networks:
      isolated_net:
        ipv4_address: "{{ dnsdist_isolated_ip }}"
      dns_net:
        ipv4_address: "{{ dnsdist_dns_ip }}"
    volumes:
      - "{{ instance_dir }}/config/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro"
    command: ["--supervised", "-C", "/etc/dnsdist/dnsdist.conf"]
    depends_on:
      coredns:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "dnsdist -e 'showServers()' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  proxy:
    <<: *security-baseline
    image: "{{ proxy_image }}"
    user: "13:13"
    entrypoint: ["/usr/sbin/squid"]
    command: ["-f", "/etc/squid/squid.conf", "-NYC"]
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    cap_add:
      - SETUID
      - SETGID
    runtime: "{{ runtime }}"
    tmpfs:
      - /var/spool/squid:noexec,nosuid,nodev
      - /var/run/squid:noexec,nosuid,nodev
      - /var/log/squid:noexec,nosuid,nodev
      - /run:size=1m,mode=0755,noexec,nosuid,nodev
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    networks:
      core_proxy_net:
        ipv4_address: "{{ proxy_core_ip }}"
      egress_net:
    volumes:
      - "{{ instance_dir }}/config/proxy/squid.conf:/etc/squid/squid.conf:ro"
      - "{{ instance_dir }}/config/proxy/allowed_domains.txt:/etc/squid/allowed_domains.txt:ro"
      - "{{ instance_dir }}/config/proxy/read_only_domains.txt:/etc/squid/read_only_domains.txt:ro"
      - "{{ instance_dir }}/config/proxy/.htpasswd:/etc/squid/htpasswd:ro"
      - "{{ instance_dir }}/config/proxy/ERR_SANDBOX_403:/usr/share/squid/errors/en/ERR_SANDBOX_403:ro"
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
      - net.ipv4.ip_forward=0
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/3128"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  core:
    <<: *security-baseline
    build:
      context: "{{ instance_dir }}/docker/core"
      dockerfile: Dockerfile.core
      args:
        - "AGENT_BASE={{ core_base_image }}"
        - "HOST_UID={{ host_uid }}"
        - "NVM_VERSION={{ nvm_version }}"
        - "NODE_VERSION={{ node_version }}"
        - "ENABLE_RUST={{ runtimes.rust | lower }}"
        - "ENABLE_TYPESCRIPT={{ runtimes.typescript | lower }}"
        - "ENABLE_GO={{ runtimes.go | lower }}"
        - "ENABLE_PYTHON={{ runtimes.python | lower }}"
    pids_limit: "{{ core_pids_limit }}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    cap_add:
      - CHOWN
    group_add:
      - "{{ in_container_workspace_bridge_gid }}"
    security_opt:
      - no-new-privileges:false
    runtime: "{{ runtime }}"
    tmpfs:
      - /home/agent/.ssh:noexec,nosuid,nodev
      - /home/agent/.cache:nosuid,nodev
      - /home/agent/.config:nosuid,nodev
      - /run:size=1m,mode=0755,noexec,nosuid,nodev
      - /tmp:nosuid,nodev
      - /var/tmp:nosuid,nodev
    networks:
      isolated_net:
        ipv4_address: "{{ agent_isolated_ip }}"
      core_proxy_net:
        ipv4_address: "{{ agent_proxy_ip }}"
      ipc_net:
        ipv4_address: "{{ core_ipc_ip }}"
    dns:
      - "{{ dnsdist_isolated_ip }}"
    extra_hosts:
      - "proxy:{{ proxy_core_ip }}"
      - "dnsdist:{{ dnsdist_isolated_ip }}"
      - "db-postgres:{{ db_postgres_ip }}"
    volumes:
{% for ws in workspaces %}      - "{{ ws.path }}:/workspaces/{{ ws.name }}:rw"
{% endfor %}
      - "{{ instance_dir }}/config/core/.bashrc:/home/agent/.bashrc:ro"
      - "{{ instance_dir }}/config/core/.npmrc:/home/agent/.npmrc:ro"
      - "{{ instance_dir }}/config/core/.gitconfig:/home/agent/.gitconfig:ro"
      - "{{ instance_dir }}/cache/core/.claude:/home/agent/.claude:rw"
      - "{{ instance_dir }}/config/core/CLAUDE.md:/home/agent/.claude/CLAUDE.md:ro"
      - "{{ instance_dir }}/config/core/.claude.json:/home/agent/.claude.json:rw"
      - "{{ instance_dir }}/custom/config/core:{{ custom_config_core }}:ro"
      - "{{ instance_dir }}/docker/core/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro"
      - "{{ instance_dir }}/config/core/sshd_config:/etc/ssh/sshd_config:ro"
      - "{{ instance_dir }}/secrets/authorized_keys:/run/secrets/authorized_keys:ro"
      - "{{ instance_dir }}/secrets/ipc_host_key:/run/secrets/ipc_host_key:ro"
      - "{{ instance_dir }}/log/core:/home/agent/.log:rw"
    sysctls:
      - net.ipv4.ip_forward=0
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    env_file:
      - "{{ instance_dir }}/.sandbox.env"
    environment:
      - "HTTP_PROXY=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "HTTPS_PROXY=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "http_proxy=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "https_proxy=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "NO_PROXY=localhost,127.0.0.1,::1,proxy,dnsdist,db-postgres,{{ isolated_subnet }},{{ core_proxy_subnet }},{{ ipc_subnet }}"
      - ANTHROPIC_API_KEY=${CORE_ANTHROPIC_API_KEY}
      - GITHUB_API_KEY=${CORE_GITHUB_TOKEN}
      - BASH_HISTORY_PATH=/home/agent/.log/.bash_history
    shm_size: "{{ core_shm_size }}"
    mem_limit: "{{ core_mem_limit }}"
    memswap_limit: "{{ core_memswap_limit }}"
    cpus: "{{ core_cpus }}"
    ulimits:
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      dnsdist:
        condition: service_healthy
      proxy:
        condition: service_healthy

  admin:
    <<: *security-baseline
    build:
      context: "{{ instance_dir }}/docker/admin"
      dockerfile: Dockerfile.admin
      args:
        - "GOLANG_BASE={{ golang_alpine_image }}"
    runtime: "{{ runtime }}"
    pids_limit: 400
    mem_limit: "8gb"
    memswap_limit: "8gb"
    cpus: "{{ admin_cpus }}"
    ulimits:
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      - net.ipv4.ip_forward=0
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    networks:
      ipc_net:
        ipv4_address: "{{ admin_ipc_ip }}"
