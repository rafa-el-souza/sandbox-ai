[project]
name = "sandbox-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bcrypt>=5.0.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.24.1",
]

[project.scripts]
sandbox = "cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "core"]

[tool.ruff]
target-version = "py314"
src = ["core", "cli", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TCH003", "RUF059", "B017"]

[tool.mypy]
strict = true
packages = ["core", "cli"]
