[project]
name = "sandbox-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=47.0.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "tomlkit>=0.13.0",
    "typer>=0.24.1",
]

[project.scripts]
sandbox = "cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/core", "src/templates"]

[tool.ruff]
target-version = "py314"
src = ["src/core", "src/cli", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TCH003", "RUF059", "B017"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["core", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "integration: subprocess-level CLI tests (run with `make test-integration`)",
    "no_warm_mock: opt out of cli/conftest.py's autouse `_warm_check` patch (for tests that exercise the real function)",
    "no_host_config_mock: opt out of cli/conftest.py's autouse `HostConfig.from_toml` patch (for tests that exercise the real loader)",
    "no_seed_registry: opt out of cli/conftest.py's autouse `seed_registry` fixture (for tests that need a truly empty per-user home, e.g. `sandbox init` first-run flows)",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
]

[tool.coverage.run]
source = ["src/cli", "src/core"]
omit = ["src/cli/__main__.py"]
