-- dnsdist(1) configuration: DNS exfiltration defense layer
-- Binds as the primary DNS entry point on 0.0.0.0:53 in the dns_net.
-- All container DNS is pointed at dnsdist; dnsdist forwards to coredns.

-- ─── Listener ────────────────────────────────────────────────────────────
setLocal("0.0.0.0:53")

-- ─── Control Socket (localhost-only, management API) ─────────────────────
controlSocket("127.0.0.1:5199")

-- ─── DNS Exfiltration Defense Filters ────────────────────────────────────
-- Wire-length filter: drop queries with wire-format qname exceeding 65 bytes.
-- Prevents data exfiltration via long subdomain labels.
addAction(QNameWireLengthRule(0, 65), DropAction())

-- Label-count filter: drop queries with more than 7 labels.
-- Prevents tunneling via deep subdomain chains (e.g., a.b.c.d.e.f.g.evil.com).
addAction(QNameLabelsCountRule(0, 7), DropAction())

-- ─── Backend (CoreDNS) ──────────────────────────────────────────────────
-- Forward all surviving queries to coredns on dns_net.
newServer({address="{{ coredns_dns_ip }}:53", name="coredns"})
