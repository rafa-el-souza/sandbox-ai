# 0. IPv6 Kernel Deprecation Boundary
# Force pure IPv4 socket to avoid Daemon collision against stripped Kernel Sysctls.
http_port 0.0.0.0:3128

# 1. Volumetric Data Loss Prevention Gate (N5)
request_body_max_size 2 MB

# 2. Cryptographic NCSA Egress Loop
# Matches Debian/Alpine paths for the auth helper
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/htpasswd
auth_param basic children 5
auth_param basic realm "Claude Sandbox Outbound Proxy"
auth_param basic credentialsttl 2 hours

# 3. Access Control Lists (ACL)
# Per-container source binding (N3) — replaces subnet-wide trusted_clients
acl agent_src src {{ agent_proxy_ip }}
acl admin_src src {{ admin_proxy_ip }}
acl firecrawl_src src {{ mcp_firecrawl_proxy_ip }}
# Require valid NCSA credentials dynamically
acl authenticated_users proxy_auth REQUIRED
# Single Source of Truth Domain Mapping
acl whitelist dstdomain "/etc/squid/allowed_domains.txt"
# Safe ports natively defined (Abandoning SSL MITM)
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT
acl safe_methods method GET HEAD OPTIONS
# Max connection limit to thwart LLM DoS loops
acl conn_limit maxconn 50
# IPv6 Total Elimination ACL
acl to_ipv6 dst ipv6

# 3.1 IP-Literal Deny ACLs — Layer 1: dst (binary IP match after DNS resolution) (N1)
# Separate ACL name per CIDR range to avoid splay tree ordering issues.
# No -n flag — DNS resolution is intentional for rebinding defense.
acl deny_rfc1918_10 dst 10.0.0.0/8
acl deny_rfc1918_172 dst 172.16.0.0/12
acl deny_rfc1918_192 dst 192.168.0.0/16
acl deny_loopback dst 127.0.0.0/8
acl deny_link_local dst 169.254.0.0/16
acl deny_cgn dst 100.64.0.0/10

# 3.2 IP-Literal Deny ACLs — Layer 2: dstdom_regex (string-level hostname pattern) (N1)
# Catches dotted-decimal IP patterns in hostname before resolution.
# Uses dstdom_regex (hostname only), NOT url_regex (full URL), to avoid path false positives.
acl deny_ip_literal dstdom_regex ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$

# 3.3 Read-Only Registry Method Restriction (N4)
acl read_only_registries dstdomain "/etc/squid/read_only_domains.txt"
acl write_methods method POST PUT PATCH DELETE

# 4. Routing Authorization Logic
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# Execute computationally hard connection-drop on DoS arrays
http_access deny conn_limit
# Geometrically drop any IPv6 resolution attempts structurally
http_access deny to_ipv6

# 4.5 Port 80 Fast-Fail TLS Upgrade
# Automatically bounces insecure HTTP requests directly
# back to the Agent as 301 HTTPS vectors via the C++ daemon natively, strictly
# abandoning the Python rewrite.py user-space script to eliminate IPC deadlocks.
acl insecure_http_port port 80
http_access deny insecure_http_port
deny_info 301:https://%H%R insecure_http_port

# 4.6 IP-Literal Deny Rules — Layer 1 + Layer 2 (N1)
# Placed before allow rule: deny-before-allow semantics (D6)
http_access deny deny_rfc1918_10
http_access deny deny_rfc1918_172
http_access deny deny_rfc1918_192
http_access deny deny_loopback
http_access deny deny_link_local
http_access deny deny_cgn
http_access deny deny_ip_literal

# 4.7 Read-Only Registry Method Deny (N4)
http_access deny write_methods read_only_registries

# Per-container IP + credentials + allowlisted domain (N3)
http_access allow agent_src authenticated_users whitelist
http_access allow admin_src authenticated_users whitelist
# Firecrawl: safe HTTP methods only (GET, HEAD, OPTIONS)
http_access allow firecrawl_src authenticated_users safe_methods whitelist

# 5. Deterministic Deny Info (403 Custom Loop)
# Squid `deny_info` requires an explicit file template rather than an inline string.
# To satisfy the exact mathematical text trace ("SANDBOX ERROR: HTTP 403..."),
# the `ERR_SANDBOX_403` literal file has been permanently instantiated in `./sandbox-pilot/infra/`.
# The layer 2 compose geometry strictly maps a Read-Only Host Bind to inject this dynamically:
# - ./sandbox-pilot/infra/ERR_SANDBOX_403:/usr/share/squid/errors/en/ERR_SANDBOX_403:ro
deny_info ERR_SANDBOX_403 all
# Fallback catch-all lock — Layer 3: structural deny-by-default (N1)
http_access deny all