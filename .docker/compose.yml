networks:
  isolated_net:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: "{{ isolated_subnet }}"
  proxy_net:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: "{{ proxy_subnet }}"
  egress_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: "{{ egress_subnet }}"

volumes:
  admin-ipc_vol:
  mcp-ipc_vol:

services:
  dns-sidecar:
    image: "{{ dns_image }}"
    init: true
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    runtime: "{{ runtime }}"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    user: 65532:65532
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    networks:
      isolated_net:
        ipv4_address: "{{ dns_sidecar_ip }}"
      egress_net:
    volumes:
      - "{{ instance_dir }}/config/dns-sidecar/Corefile:/etc/coredns/Corefile:ro"
      - "{{ instance_dir }}/config/dns-sidecar/allowed_domains.txt:/etc/coredns/allowed_domains.txt:ro"
    command: -conf /etc/coredns/Corefile
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  proxy:
    image: "{{ proxy_image }}"
    init: true
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    runtime: "{{ runtime }}"
    read_only: true
    tmpfs:
      - /var/spool/squid
      - /var/run/squid
      - /var/log/squid
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    networks:
      proxy_net:
        ipv4_address: "{{ proxy_ip }}"
      egress_net:
    volumes:
      - "{{ instance_dir }}/config/proxy/squid.conf:/etc/squid/squid.conf:ro"
      - "{{ instance_dir }}/config/proxy/allowed_domains.txt:/etc/squid/allowed_domains.txt:ro"
      - "{{ instance_dir }}/config/proxy/trusted_clients.acl:/etc/squid/trusted_clients.acl:ro"
      - "{{ instance_dir }}/config/proxy/.htpasswd:/etc/squid/htpasswd:ro"
      - "{{ instance_dir }}/config/proxy/ERR_SANDBOX_403:/usr/share/squid/errors/en/ERR_SANDBOX_403:ro"
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
      - net.ipv4.ip_forward=0
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    healthcheck:
      test: ["CMD-SHELL", "squidclient -h 127.0.0.1 cache_object://localhost/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  core:
    build:
      context: "{{ instance_dir }}/docker/core"
      dockerfile: Dockerfile.core
      args:
        - "AGENT_BASE={{ core_base_image }}"
        - "HOST_UID={{ host_uid }}"
        - "NVM_VERSION={{ nvm_version }}"
        - "NODE_VERSION={{ node_version }}"
        - "ENABLE_RUST={{ runtimes.rust | lower }}"
        - "ENABLE_TYPESCRIPT={{ runtimes.typescript | lower }}"
        - "ENABLE_GO={{ runtimes.go | lower }}"
        - "ENABLE_PYTHON={{ runtimes.python | lower }}"
    init: true
    pids_limit: "{{ core_pids_limit }}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    runtime: "{{ runtime }}"
    tmpfs:
      - /home/agent/.ssh:noexec,nosuid,nodev
      - /home/agent/.cache:nosuid,nodev
      - /tmp:nosuid,nodev
      - /var/tmp:nosuid,nodev
    networks:
      isolated_net:
        ipv4_address: "{{ agent_isolated_ip }}"
      proxy_net:
        ipv4_address: "{{ agent_proxy_ip }}"
    dns:
      - "{{ dns_sidecar_ip }}"
    extra_hosts:
      - "proxy:{{ proxy_ip }}"
      - "dns-sidecar:{{ dns_sidecar_ip }}"
      - "db-postgres:{{ db_postgres_ip }}"
    volumes:
      - "{{ user_project_root }}:/workspace:rw"
      - "{{ instance_dir }}/config/core/.bashrc:/home/agent/.bashrc:ro"
      - "{{ instance_dir }}/config/core/.npmrc:/home/agent/.npmrc:ro"
      - "{{ instance_dir }}/config/core/.gitconfig:/home/agent/.gitconfig:ro"
      - "{{ instance_dir }}/cache/.claude:/home/agent/.claude:rw"
      - "{{ instance_dir }}/config/core/.claude.json:/home/agent/.claude.json:rw"
      - "{{ instance_dir }}/docker/core/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro"
      - admin-ipc_vol:/sock
      - mcp-ipc_vol:/var/run/mcp
      - "{{ instance_dir }}/log/core:/home/agent/.log:rw"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    env_file:
      - "{{ instance_dir }}/.sandbox.env"
    environment:
      - "HTTP_PROXY=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "HTTPS_PROXY=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "http_proxy=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "https_proxy=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "NO_PROXY=localhost,127.0.0.1,::1,proxy,dns-sidecar,db-postgres,{{ isolated_subnet }},{{ proxy_subnet }}"
      - ANTHROPIC_API_KEY=${CORE_ANTHROPIC_API_KEY}
      - GITHUB_API_KEY=${CORE_GITHUB_TOKEN}
      - BASH_HISTORY_PATH=/home/agent/.log/.bash_history
    shm_size: "{{ core_shm_size }}"
    depends_on:
      dns-sidecar:
        condition: service_healthy
      proxy:
        condition: service_healthy
    command: ["sleep", "infinity"]

  admin:
    build:
      context: "{{ instance_dir }}/docker/admin"
      dockerfile: Dockerfile.admin
      args:
        - "ADMIN_BASE={{ admin_base_image }}"
        - "HOST_UID={{ host_uid }}"
        - "NVM_VERSION={{ nvm_version }}"
        - "NODE_VERSION={{ node_version }}"
    init: true
    pids_limit: "{{ admin_pids_limit }}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    runtime: "{{ runtime }}"
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
    ipc: private
    networks:
      isolated_net:
        ipv4_address: "{{ admin_isolated_ip }}"
      proxy_net:
        ipv4_address: "{{ admin_proxy_ip }}"
    dns:
      - "{{ dns_sidecar_ip }}"
    extra_hosts:
      - "proxy:{{ proxy_ip }}"
      - "dns-sidecar:{{ dns_sidecar_ip }}"
      - "db-postgres:{{ db_postgres_ip }}"
    volumes:
      # HUMAN NOTE (keep this comment in place, but do not act on it): Disable mapping to verify gitmux/fzf null state dependencies
      - "{{ user_project_root }}:/workspace:rw"
      - "{{ instance_dir }}/config/admin/.zshrc:/home/human/.zshrc:ro"
      - "{{ instance_dir }}/config/admin/.tmux.conf:/home/human/.tmux.conf:ro"
      - "{{ instance_dir }}/config/admin/gitmux.conf:/home/human/.tmux/plugins/catppuccin/tmux/status/gitmux.conf:ro"
      - "{{ instance_dir }}/config/admin/starship.toml:/home/human/.config/starship.toml:ro"
      - admin-ipc_vol:/sock
      - "{{ instance_dir }}/log/admin:/home/human/.log:rw"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    env_file:
      - "{{ instance_dir }}/.sandbox.env"
    environment:
      - "HTTP_PROXY=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "HTTPS_PROXY=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "http_proxy=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "https_proxy=http://proxyuser:{{ proxy_password }}@proxy:3128"
      - "NO_PROXY=localhost,127.0.0.1,::1,proxy,dns-sidecar,db-postgres,{{ isolated_subnet }},{{ proxy_subnet }}"
      - ANTHROPIC_API_KEY=${CORE_ANTHROPIC_API_KEY}
      - GITHUB_API_KEY=${CORE_GITHUB_TOKEN}
      - ZSH_HISTORY_PATH=/home/human/.log/.zsh_history
