# no-mistakes gate config. Trusted-only: the daemon reads this from the
# default branch, never from the pushed branch - changes here land via PR.
#
# Every lint/test command runs inside a hardened-run container (rootless
# podman + gVisor). The fetch profile provides egress for dependency installs:
# uv bootstrap, the uv-managed CPython 3.14 download (this repo pins 3.14; the
# pinned image ships 3.13), and pyright's node runtime. The container rootfs
# is read-only, so HOME is redirected into the worktree (.nm-home/,
# gitignored) - uv caches, the managed toolchain, and pyright's node persist
# per-worktree across runs.

commands:
  lint: >-
    hardened-run --profile fetch --image python-3.13 -d "$PWD" -- bash -c
    'set -e; export HOME="$PWD/.nm-home" PATH="$PWD/.nm-home/.local/bin:$PATH"
    USER="${USER:-nm-gate}" LOGNAME="${LOGNAME:-nm-gate}";
    command -v uv >/dev/null || pip install -q --target "$PWD/.nm-home/.local" uv;
    make lint'
  test: >-
    hardened-run --profile fetch --image python-3.13 -d "$PWD" -- bash -c
    'set -e; export HOME="$PWD/.nm-home" PATH="$PWD/.nm-home/.local/bin:$PATH"
    USER="${USER:-nm-gate}" LOGNAME="${LOGNAME:-nm-gate}";
    command -v uv >/dev/null || pip install -q --target "$PWD/.nm-home/.local" uv;
    make typecheck pyright coverage'
