# no-mistakes gate config. Trusted-only: the daemon reads this from the
# default branch, never from the pushed branch - changes here land via PR.
#
# Every lint/test command runs inside a hardened-run container (rootless
# podman + gVisor). The image ships uv AND CPython 3.14, which is what this
# repo pins (requires-python = ">=3.14,<3.15"), so neither the uv bootstrap nor
# the uv-managed interpreter download happens any more - both used to run on
# every gate invocation. The fetch profile is still required: `uv sync` fetches
# dependencies and pyright fetches its node runtime. The container rootfs is
# read-only, so HOME is redirected into the worktree (.nm-home/, gitignored) -
# uv caches and pyright's node persist per-worktree across runs.
#
# The image name is the single source of the gate's Python version: it ships
# exactly one interpreter and `uv sync` selects it. Keep it in step with
# requires-python in pyproject.toml - if the image drifts below that floor, uv
# silently downloads a matching interpreter again and the gate pays for it on
# every run instead of failing loudly.
#
# The bootstrap USED to live here (`command -v uv || pip install ... uv`) and
# had to go: an unattended agent cannot run it. The `>` redirect trips the
# "shell operator after a sandbox-excluded command" guard, and `pip install`
# trips the "package install onto the host" guard - both fire on the command
# line, before anything reaches the container. A gate the fleet cannot run is
# a gate that produces unvalidated commits at 3am.

commands:
  lint: >-
    hardened-run --profile fetch --image uv-python-3.14 -d "$PWD" -- bash -c
    'set -e; export HOME="$PWD/.nm-home"
    USER="${USER:-nm-gate}" LOGNAME="${LOGNAME:-nm-gate}";
    make lint'
  test: >-
    hardened-run --profile fetch --image uv-python-3.14 -d "$PWD" -- bash -c
    'set -e; export HOME="$PWD/.nm-home"
    USER="${USER:-nm-gate}" LOGNAME="${LOGNAME:-nm-gate}";
    make typecheck pyright coverage'
